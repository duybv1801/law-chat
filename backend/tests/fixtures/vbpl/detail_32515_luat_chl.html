uản\",\"unitContent\":\"Bộ Tư pháp\",\"address\":\"Địa chỉ\",\"addressContent\":\"Số 60 Trần Phú - Ba Đình - Thành phố Hà Nội\",\"phoneNumber\":\"Điện thoại\",\"phoneNumberContent\":\"024.6273.9468\",\"fax\":\"Fax\",\"faxContent\":\"024.6273.9359\"},\"underConstruction\":{\"title\":\"Đang cập nhật\",\"message\":\"Chức năng này đang được phát triển.\"},\"gioiThieu\":{\"timeline\":{\"2005\":{\"description\":\"Năm 2005 đánh dấu sự khởi đầu của dự án xây dựng Cơ sở dữ liệu quốc gia về pháp luật, với mục tiêu số hóa và tập trung hóa các văn bản pháp luật của Việt Nam.\"},\"2012-2013\":{\"description\":\"Giai đoạn 2012-2013 là thời kỳ phát triển và mở rộng hệ thống, với việc tích hợp thêm nhiều tính năng và cải thiện giao diện người dùng.\"},\"2023-2025\":{\"description\":\"Giai đoạn 2023-2025 tập trung vào việc nâng cấp và hiện đại hóa hệ thống, áp dụng các công nghệ mới và mở rộng phạm vi phục vụ.\"}},\"overview\":{\"title\":\"SƠ LƯỢC MÔ HÌNH CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"CSDLQG về pháp luật tập hợp các văn bản quy phạm pháp luật và văn bản hợp nhất văn bản quy phạm pháp luật (sau đây gọi chung là văn bản) dưới dạng văn bản điện tử do Chính phủ thống nhất quản lý, có địa chỉ truy cập vbpl.vn, bao gồm các Cơ sở dữ liệu thành phần: Cơ sở dữ liệu văn bản pháp luật Trung ương và Cơ sở dữ liệu văn bản pháp luật địa phương.\",\"central\":{\"title\":\"Cơ sở dữ liệu Văn bản pháp luật Trung ương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của các Bộ, cơ quan ngang Bộ, cơ quan nhà nước khác ở Trung ương ban hành hoặc phối hợp ban hành. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật; Văn bản hợp nhất; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"local\":{\"title\":\"Cơ sở dữ liệu văn bản pháp luật địa phương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của từng tỉnh, thành phố trực thuộc Trung ương trên toàn quốc. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật của Hội đồng nhân dân và Ủy ban nhân dân; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"other\":{\"title\":\"Các chuyên mục khác\",\"content\":\"Ngoài các Cơ sở dữ liệu thành phần kể trên, CSDLQG về pháp luật còn có các chuyên mục khác như: Giới thiệu văn bản mới, Tin tức, Tình huống pháp luật. Ngoài ra, CSDLQG về thủ tục hành chính, bộ pháp điển điện tử, cổng thông tin điện tử Bộ Tư pháp cũng trích xuất về CSDLQG về pháp luật.\"}},\"vision\":{\"title\":\"Tầm nhìn\",\"content\":\"Trở thành nguồn tra cứu văn bản pháp luật chính thống, đầy đủ và đáng tin cậy, phục vụ hiệu quả cho người dân, doanh nghiệp và cơ quan nhà nước.\"},\"mission\":{\"title\":\"Sứ mệnh\",\"content\":\"Cung cấp hệ thống văn bản pháp luật được cập nhật kịp thời, tra cứu thuận tiện, góp phần nâng cao nhận thức pháp luật và bảo đảm việc tuân thủ pháp luật trong xã hội.\"},\"features\":{\"title\":\"MỘT SỐ TÍNH NĂNG, TIỆN ÍCH CỦA CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"Hiện nay, CSDLQG về PL có giao diện tương đối thân thiện, dễ tìm kiếm, dễ khai thác các thông tin và tải về sử dụng. Cơ sở dữ liệu cung cấp các chức năng, tiện ích cơ bản và thuận tiện\",\"list\":[{\"key\":\"fullText\",\"label\":\"Tra cứu toàn văn\",\"icon\":\"SearchOutlined\"},{\"key\":\"tableOfContents\",\"label\":\"Tự động tạo mục lục\",\"icon\":\"BookOutlined\"},{\"key\":\"relatedDocuments\",\"label\":\"Liên kết văn bản liên quan\",\"icon\":\"LinkOutlined\"},{\"key\":\"validity\",\"label\":\"Xác định hiệu lực tự động\",\"icon\":\"BarChartOutlined\"},{\"key\":\"validityHistory\",\"label\":\"Lịch sử hiệu lực\",\"icon\":\"ClockCircleOutlined\"},{\"key\":\"download\",\"label\":\"Tải văn bản\",\"icon\":\"DownloadOutlined\"},{\"key\":\"english\",\"label\":\"Xem văn bản tiếng Anh\",\"icon\":\"GlobalOutlined\"},{\"key\":\"centralLocal\",\"label\":\"Liên kết văn bản Trung ương – địa phương\",\"icon\":\"ShareAltOutlined\"},{\"key\":\"diagram\",\"label\":\"Lược đồ văn bản\",\"icon\":\"FileTextOutlined\"}]}},\"mostViewed\":{\"title\":\"Văn bản được xem nhiều\",\"viewCount\":\" ew Roman', serif; font-size: 14px;\"\u003e\u003cem\u003eCăn cứ Hiến pháp nước Cộng hòa xã hội chủ nghĩa Việt Nam năm 1992 đã được sửa đổi, bổ sung một số điều theo Nghị quyết số 51/2001/QH10;\u003c/em\u003e\u003c/p\u003e\n  \u003cp style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e\u003cem\u003eQuốc hội ban hành Luật hòa giải ở cơ sở. \u003c/em\u003e\u003c/p\u003e\n  \u003cp id=\"c540b220-2c85-11f1-a9ad-35bc5f92c069\" class=\"prov-chapter\" align=\"center\" style=\"font-family: 'Times New Roman', serif; font-size: 14px; text-align: center;\"\u003e\u003cstrong\u003eChương I\u003cbr\u003e\n     NHỮNG QUY ĐỊNH CHUNG\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"c5412750-2c85-11f1-873f-a112d4fbed92\" class=\"prov-article\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 1.\u003c/strong\u003e \u003cstrong\u003ePhạm vi điều chỉnh\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"c541275a-2c85-11f1-9f0f-5934e2b4e20e\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e1. Luật này quy định nguyên tắc, chính sách của Nhà nước về hòa giải ở cơ sở, hòa giải viên, tổ hòa giải; hoạt động hòa giải ở cơ sở; trách nhiệm của cơ quan, tổ chức trong hoạt động hòa giải ở cơ sở.\u003c/p\u003e\n  \u003cp id=\"c5412764-2c85-11f1-8ce8-6d47fc5ae30d\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e2. Hoạt động hòa giải của tòa án, trọng tài, hòa giải thương mại, hòa giải lao động và hòa giải tại Ủy ban nhân dân xã, phường, thị trấn (sau đây gọi chung là cấp xã) không thuộc phạm vi điều chỉnh của Luật này.\u003c/p\u003e\n  \u003cp id=\"c541276e-2c85-11f1-8d9a-e7e340c9eecf\" class=\"prov-article\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 2. Giải thích từ ngữ\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003eTrong Luật này, các từ ngữ dưới đây được hiểu như sau:\u003c/p\u003e\n  \u003cp id=\"c5412778-2c85-11f1-aaa5-8db016f1d018\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e1. \u003cem\u003eHòa giải ở cơ sở\u003c/em\u003e là việc hòa giải viên hướng dẫn, giúp đỡ các bên đạt được thỏa thuận, tự nguyện giải quyết với nhau các mâu thuẫn, tranh chấp, vi phạm pháp luật theo quy định của Luật này.\u003c/p\u003e\n  \u003cp id=\"c5412782-2c85-11f1-bf84-db451c0dd063\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e2. \u003cem\u003eCơ sở\u003c/em\u003e là thôn, làng, ấp, bản, buôn, phum, sóc, tổ dân phố, khu phố, khối phố và cộng đồng dân cư khác (sau đây gọi chung là thôn, tổ dân phố).\u003c/p\u003e\n  \u003cp id=\"c541278c-2c85-11f1-b12f-1b8335d124d7\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e3. \u003cem\u003eCác bên\u003c/em\u003e là cá nhân, nhóm cá nhân, gia đình, nhóm gia đình, tổ chức có mâu thuẫn, tranh chấp, vi phạm pháp luật theo quy định của Luật này.\u003c/p\u003e\n  \u003cp id=\"c54238c0-2c85-11f1-9acd-8f5e65ec27e5\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e4. \u003cem\u003eHòa giải viên\u003c/em\u003e là người được công nhận theo quy định của Luật này để thực hiện hoạt động hòa giải ở cơ sở.\u003c/p\u003e\n  \u003cp id=\"c5425fd0-2c85-11f1-a2e1-3f71756b711e\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e5. \u003cem\u003eTổ hòa giải\u003c/em\u003e là tổ chức tự quản của nhân dân được thành lập ở cơ sở để hoạt động hòa giải theo quy định của Luật này.\u003c/p\u003e\n  \u003cp id=\"c54286e0-2c85-11f1-b188-e72a7f74d8d7\" class=\"prov-article\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 3. Phạm vi hòa giải ở cơ sở\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"c542adf0-2c85-11f1-b55c-3701a4a020e9\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e1. Việc hòa giải ở cơ sở được tiến hành đối với các mâu thuẫn, tranh chấp, vi phạm pháp luật, trừ các trường hợp sau đây:\u003c/p\u003e\n  \u003cp id=\"c542fc10-2c85-11f1-88b0-2144b2bc842c\" class=\"prov-item\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003ea) Mâu thuẫn, tranh chấp xâm phạm lợi ích của Nhà nước, lợi ích công cộng;\u003c/p\u003e\n  \u003cp id=\"c5432320-2c85-11f1-b434-056df7f44294\" class=\"prov-item\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003eb) Vi phạm pháp luật về hôn nhân và gia đình, giao dịch dân sự mà theo quy định của pháp luật tố tụng dân sự không được hòa giải;\u003c/p\u003e\n  \u003cp id=\"c5434a30-2c85-11f1-a61e-ddf052ec0359\" class=\"prov-item\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003ec) Vi phạm pháp luật mà theo quy định phải bị truy cứu trách nhiệm hình sự hoặc bị xử lý vi phạm hành chính;\u003c/p\u003e\n  \u003cp id=\"c5439850-2c85-11f1-845a-fd1d5937cb1d\" class=\"prov-item\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003ed) Mâu thuẫn, tranh chấp khác không được hòa giải ở cơ sở theo quy định pháp luật.\u003c/p\u003e\n  \u003cp id=\"c543e670-2c85-11f1-9617-f1a008c5cf2d\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e2. Chính phủ quy định chi tiết Điều này.\u003c/p\u003e\n  \u003cp id=\"c5440d80-2c85-11f1-8c4f-a18a74526539\" class=\"prov-article\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 4. Nguyên tắc tổ chức, hoạt động hòa giải ở cơ sở\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"c5443490-2c85-11f1-b220-6f3bedc76cc1\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e1. Tôn trọng sự tự nguyện của các bên; không bắt buộc, áp đặt các bên trong hòa giải ở cơ sở.\u003c/p\u003e\n  \u003cp id=\"c5445ba0-2c85-11f1-b36f-15fdc2936b03\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e2. Bảo đảm phù hợp với chính sách, pháp luật của Nhà nước, đạo đức xã hội, phong tục, tập quán tốt đẹp của nhân dân; phát huy tinh thần đoàn kết, tương trợ, giúp đỡ lẫn nhau giữa các thành viên trong gia đình, dòng họ và cộng đồng dân cư; quan tâm đến quyền, lợi ích hợp pháp của trẻ em, phụ nữ, người khuyết tật và người cao tuổi.\u003c/p\u003e\n  \u003cp id=\"c54482b0-2c85-11f1-994c-11c1f606f5dd\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e3. Khách quan, công bằng, kịp thời, có lý, có tình; giữ bí mật thông tin đời tư của các bên, trừ trường hợp quy định tại khoản 4 và khoản 5 Điều 10 của Luật này.\u003c/p\u003e\n  \u003cp id=\"c544a9c0-2c85-11f1-ba46-2d41f72aebbe\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e4. Tôn trọng ý chí, quyền và lợi ích hợp pháp của các bên, quyền và lợi ích hợp pháp của người khác; không xâm phạm lợi ích của Nhà nước, lợi ích công cộng.\u003c/p\u003e\n  \u003cp id=\"c544d0d0-2c85-11f1-8a38-7910b34a7a3c\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e5. Bảo đảm bình đẳng giới trong tổ chức và hoạt động hòa giải ở cơ sở.\u003c/p\u003e\n  \u003cp id=\"c544f7e0-2c85-11f1-a687-95d6c9ce42fb\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e6. Không lợi dụng hòa giải ở cơ sở để ngăn cản các bên liên quan bảo vệ quyền lợi của mình theo quy định của pháp luật hoặc trốn tránh việc xử lý vi phạm hành chính, xử lý về hình sự.\u003c/p\u003e\n  \u003cp id=\"c5451ef0-2c85-11f1-9625-17a7fe0fe67e\" class=\"prov-article\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 5. Chính sách của Nhà nước về hòa giải ở cơ sở\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"c5456d10-2c85-11f1-8097-9190ef912428\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e1. Khuyến khích các bên giải quyết mâu thuẫn, tranh chấp bằng hình thức hòa giải ở cơ sở và các hình thức hòa giải thích hợp khác.\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003eKhuyến khích những người có uy tín trong gia đình, dòng họ, cộng đồng dân cư tham gia hòa giải ở cơ sở và tham gia các hình thức hòa giải thích hợp khác.\u003c/p\u003e\n  \u003cp id=\"c5459420-2c85-11f1-86c3-9be06e8dd10f\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e2. Phát huy vai trò nòng cốt của Mặt trận Tổ quốc Việt Nam và các tổ chức thành viên của Mặt trận trong công tác hòa giải ở cơ sở.\u003c/p\u003e\n  \u003cp id=\"c545bb30-2c85-11f1-b9b4-f989625ff396\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e3. Tạo điều kiện, hỗ trợ cho hoạt động hòa giải ở cơ sở; khuyến khích tổ chức, cá nhân đóng góp, hỗ trợ cho hoạt động hòa giải ở cơ sở.\u003c/p\u003e\n  \u003cp id=\"c545e240-2c85-11f1-9df9-e3e5313b5f0d\" class=\"prov-article\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 6. Hỗ trợ kinh phí cho công tác hòa giải ở cơ sở\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"c5460950-2c85-11f1-b182-b167ff466496\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e1. Nhà nước hỗ trợ kinh phí cho công tác hòa giải ở cơ sở để biên soạn, phát hành tài liệu; tổ chức bồi dưỡng, hướng dẫn nghiệp vụ, kỹ năng về hòa giải ở cơ sở; sơ kết, tổng kết, khen thưởng đối với công tác hòa giải ở cơ sở; chi thù lao cho hòa giải viên theo vụ, việc và hỗ trợ các chi phí cần thiết khác cho hoạt động hòa giải ở cơ sở.\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003eNgân sách trung ương chi bổ sung cho các địa phương chưa tự cân đối được ngân sách để hỗ trợ kinh phí cho công tác hòa giải ở cơ sở.\u003c/p\u003e\n  \u003cp id=\"c5463060-2c85-11f1-aaea-c975f5a645fb\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e2. Chính phủ quy định chi tiết Điều này.\u003c/p\u003e\n  \u003cp id=\"c5467e80-2c85-11f1-9818-a1e09810a59d\" class=\"prov-chapter\" align=\"center\" style=\"font-family: 'Times New Roman', serif; font-size: 14px; text-align: center;\"\u003e\u003cstrong\u003eChương II\u003cbr\u003e\n     HÒA GIẢI VIÊN, TỔ HÒA GIẢI\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"c546a590-2c85-11f1-9f71-096180f0a98d\" class=\"prov-section\" align=\"center\" style=\"font-family: 'Times New Roman', serif; font-size: 14px; text-align: center;\"\u003e\u003cstrong\u003eMục 1\u003cbr\u003e\n     HÒA GIẢI VIÊN\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"c546cca0-2c85-11f1-a038-6530229857ff\" class=\"prov-article\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 7. Tiêu chuẩn hòa giải viên\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003eNgười được bầu làm hòa giải viên phải là công dân Việt Nam thường trú tại cơ sở, tự nguyện tham gia hoạt động hòa giải và có các tiêu chuẩn sau đây:\u003c/p\u003e\n  \u003cp id=\"c5471ac0-2c85-11f1-b77f-21173c24c37d\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e1. Có phẩm chất đạo đức tốt; có uy tín trong cộng đồng dân cư;\u003c/p\u003e\n  \u003cp id=\"c54741d0-2c85-11f1-821a-8dd15d5cd1b9\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e2. Có khả năng thuyết phục, vận động nhân dân; có hiểu biết pháp luật.\u003c/p\u003e\n  \u003cp id=\"c54768e0-2c85-11f1-aae6-092d3ffe4fc6\" class=\"prov-article\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 8. Bầu, công nhận hòa giải viên\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"c54768ea-2c85-11f1-b61c-918f69518de0\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e1. Người có đủ tiêu chuẩn theo quy định tại Điều 7 của Luật này có quyền ứng cử hoặc được Ban công tác Mặt trận phối hợp với các tổ chức thành viên của Mặt trận giới thiệu vào danh sách bầu hòa giải viên.\u003c/p\u003e\n  \u003cp id=\"c54768f4-2c85-11f1-a60b-277eb6250514\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e2. Trưởng ban công tác Mặt trận chủ trì, phối hợp với trưởng thôn, tổ trưởng tổ dân phố tổ chức bầu hòa giải viên ở thôn, tổ dân phố bằng một trong các hình thức sau đây:\u003c/p\u003e\n  \u003cp id=\"c54768fe-2c85-11f1-a098-e3c2b15d5c4d\" class=\"prov-item\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003ea) Biểu quyết công khai hoặc bỏ phiếu kín tại cuộc họp đại diện các hộ gia đình;\u003c/p\u003e\n  \u003cp id=\"c547de10-2c85-11f1-9068-91b0c1678450\" class=\"prov-item\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003eb) Phát phiếu lấy ý kiến các hộ gia đình.\u003c/p\u003e\n  \u003cp id=\"c547de1a-2c85-11f1-a1b7-5b93e53279ed\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e3. Kết quả bầu hòa giải viên:\u003c/p\u003e\n  \u003cp id=\"c547de24-2c85-11f1-9b3a-eda0b2949f90\" class=\"prov-item\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003ea) Người được đề nghị công nhận là hòa giải viên phải đạt trên 50% đại diện hộ gia đình trong thôn, tổ dân phố đồng ý;\u003c/p\u003e\n  \u003cp id=\"c547de2e-2c85-11f1-a344-975556eded06\" class=\"prov-item\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003eb) Trường hợp số người đạt trên 50% đại diện hộ gia đình trong thôn, tổ dân phố đồng ý nhiều hơn số lượng hòa giải viên được Chủ tịch Ủy ban nhân dân cấp xã quyết định theo quy định tại khoản 2 Điều 12 của Luật này thì danh sách người được đề nghị công nhận là hòa giải viên lấy theo kết quả bỏ phiếu từ cao xuống thấp;\u003c/p\u003e\n  \u003cp id=\"c547de38-2c85-11f1-ac1f-47c3670f1004\" class=\"prov-item\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003ec) Trường hợp số người được bầu không đủ để thành lập tổ hòa giải thì tổ chức bầu bổ sung cho đủ số lượng;\u003c/p\u003e\n  \u003cp id=\"c547de42-2c85-11f1-9ce2-63eadba639a0\" class=\"prov-item\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003ed) Trưởng ban công tác Mặt trận lập danh sách người được đề nghị công nhận là hòa giải viên gửi Chủ tịch Ủy ban nhân dân cấp xã.\u003c/p\u003e\n  \u003cp id=\"c547de4c-2c85-11f1-9a5d-43e98cb15059\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e4. Chủ tịch Ủy ban nhân dân cấp xã ra quyết định công nhận hòa giải viên. Quyết định công nhận hòa giải viên được gửi cho Ban thường trực Ủy ban Mặt trận Tổ quốc Việt Nam cấp xã, Trưởng ban công tác Mặt trận, trưởng thôn, tổ trưởng tổ dân phố, hòa giải viên và thông báo công khai ở thôn, tổ dân phố.\u003c/p\u003e\n  \u003cp id=\"c547de56-2c85-11f1-8895-c7cf296a77e9\" class=\"prov-article\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 9. Quyền của hòa giải viên\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"c547de60-2c85-11f1-bf30-37f264bf1df0\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e1. Thực hiện hoạt động hòa giải ở cơ sở.\u003c/p\u003e\n  \u003cp id=\"c547de6a-2c85-11f1-b308-05df6f73b9d1\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e2. Đề nghị các bên có liên quan cung cấp tài liệu, thông tin liên quan đến vụ, việc hòa giải.\u003c/p\u003e\n  \u003cp id=\"c547de74-2c85-11f1-b915-63dc13cdf834\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e3. Tham gia sinh hoạt, thảo luận và quyết định nội dung, phương thức hoạt động của tổ hòa giải.\u003c/p\u003e\n  \u003cp id=\"c547de7e-2c85-11f1-be98-2d7b7390d9d2\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e4. Được bồi dưỡng kiến thức pháp luật, nghiệp vụ và kỹ năng hòa giải; được cung cấp tài liệu liên quan đến hoạt động hòa giải.\u003c/p\u003e\n  \u003cp id=\"c547de88-2c85-11f1-922e-9f7796264a1f\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e5. Hưởng thù lao theo vụ, việc khi thực hiện hòa giải.\u003c/p\u003e\n  \u003cp id=\"c54a4f10-2c85-11f1-865b-d30314741723\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e6. Được khen thưởng theo quy định của pháp luật về thi đua, khen thưởng.\u003c/p\u003e\n  \u003cp id=\"c54a9d30-2c85-11f1-8ad4-a3500f2ae8d4\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e7. Được hỗ trợ, tạo điều kiện để khắc phục hậu quả nếu gặp tai nạn hoặc rủi ro ảnh hưởng đến sức khỏe, tính mạng trong khi thực hiện hoạt động hòa giải.\u003c/p\u003e\n  \u003cp id=\"c54ac440-2c85-11f1-80a9-59cc5c126cde\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e8. Kiến nghị, đề xuất về các vấn đề liên quan đến hoạt động hòa giải.\u003c/p\u003e\n  \u003cp id=\"c54aeb50-2c85-11f1-b6e8-cdb6f71a9ec2\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e9. Chính phủ quy định chi tiết khoản 5 và khoản 7 Điều này.\u003c/p\u003e\n  \u003cp id=\"c54b1260-2c85-11f1-be1a-870b5d8ae892\" class=\"prov-article\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 10. Nghĩa vụ của hòa giải viên\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"c54b3970-2c85-11f1-8729-6d35a219e718\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e1. Thực hiện hòa giải khi có căn cứ theo quy định tại Điều 16 của Luật này.\u003c/p\u003e\n  \u003cp id=\"c54b397a-2c85-11f1-b3cf-6b70807b21ad\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e2. Tuân thủ các nguyên tắc quy định tại Điều 4 của Luật này.\u003c/p\u003e\n  \u003cp id=\"c54b8790-2c85-11f1-9d9f-f97600edea22\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e3. Từ chối tiến hành hòa giải nếu bản thân có quyền lợi và nghĩa vụ liên quan đến vụ, việc hòa giải hoặc vì lý do khác dẫn đến không thể bảo đảm khách quan, công bằng trong hòa giải.\u003c/p\u003e\n  \u003cp id=\"c54baea0-2c85-11f1-8ab5-c54d12a497ba\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e4. Thông báo kịp thời cho tổ trưởng tổ hòa giải để báo cáo Chủ tịch Ủy ban nhân dân cấp xã có biện pháp phòng ngừa trong trường hợp thấy mâu thuẫn, tranh chấp nghiêm trọng có thể dẫn đến hành vi bạo lực gây ảnh hưởng đến sức khoẻ, tính mạng của các bên hoặc gây mất trật tự công cộng.\u003c/p\u003e\n  \u003cp id=\"c54bd5b0-2c85-11f1-be17-6f33c5d721e8\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e5. Thông báo kịp thời cho tổ trưởng tổ hòa giải để báo cáo cơ quan có thẩm quyền xử lý trong trường hợp phát hiện mâu thuẫn, tranh chấp có dấu hiệu vi phạm pháp luật về xử lý vi phạm hành chính hoặc pháp luật về hình sự.\u003c/p\u003e\n  \u003cp id=\"c54bfcc0-2c85-11f1-8ad4-9378339f2963\" class=\"prov-article\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 11. Thôi làm hòa giải viên\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"c54bfcca-2c85-11f1-a6ce-af1d962b5881\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e1. Việc thôi làm hòa giải viên được thực hiện trong các trường hợp sau đây:\u003c/p\u003e\n  \u003cp id=\"c54c23d0-2c85-11f1-a117-ff7feccaf967\" class=\"prov-item\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003ea) Theo nguyện vọng của hòa giải viên;\u003c/p\u003e\n  \u003cp id=\"c54c4ae0-2c85-11f1-bbc9-f9a446071a60\" class=\"prov-item\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003eb) Hòa giải viên không còn đáp ứng một trong các tiêu chuẩn quy định tại Điều 7 của Luật này;\u003c/p\u003e\n  \u003cp id=\"c54c71f0-2c85-11f1-8f67-c5dc22fcf692\" class=\"prov-item\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003ec) Vi phạm nguyên tắc tổ chức, hoạt động hòa giải ở cơ sở theo quy định tại Điều 4 của Luật này hoặc không có điều kiện tiếp tục làm hòa giải viên do bị xử lý vi phạm pháp luật.\u003c/p\u003e\n  \u003cp id=\"c54c9900-2c85-11f1-8687-ed053e144f08\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e2.\u003cstrong\u003e \u003c/strong\u003eTrường hợp thôi làm hòa giải viên quy định tại khoản 1 Điều này thì tổ trưởng tổ hòa giải đề nghị Trưởng ban công tác Mặt trận phối hợp với trưởng thôn, tổ trưởng tổ dân phố làm văn bản đề nghị Chủ tịch Ủy ban nhân dân cấp xã ra quyết định thôi làm hòa giải viên.\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003eTrường hợp thôi làm hòa giải viên đối với tổ trưởng tổ hòa giải thì Trưởng ban công tác Mặt trận phối hợp với trưởng thôn, tổ trưởng tổ dân phố làm văn bản đề nghị Chủ tịch Ủy ban nhân dân cấp xã ra quyết định thôi làm hòa giải viên.\u003c/p\u003e\n  \u003cp id=\"c54cc010-2c85-11f1-927f-abb1a0a4ccdc\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e3. Quyết định thôi làm hòa giải viên được gửi Ban thường trực Ủy ban Mặt trận Tổ quốc Việt Nam cấp xã, Trưởng ban công tác Mặt trận, trưởng thôn, tổ trưởng tổ dân phố, hòa giải viên và thông báo công khai ở thôn, tổ dân phố.\u003c/p\u003e\n  \u003cp id=\"c54cc01a-2c85-11f1-b2d9-3b2a337a00b2\" class=\"prov-section\" align=\"center\" style=\"font-family: 'Times New Roman', serif; font-size: 14px; text-align: center;\"\u003e\u003cstrong\u003eMục 2\u003cbr\u003e\n     TỔ HÒA GIẢI\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"c54ce720-2c85-11f1-86f9-4f3755196c0f\" class=\"prov-article\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 12. Tổ hòa giải\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"c54d0e30-2c85-11f1-b6ac-692243406560\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e1.\u003cstrong\u003e\u003cem\u003e \u003c/em\u003e\u003c/strong\u003eTổ hòa giải có tổ trưởng và các hòa giải viên. Mỗi tổ hòa giải có từ 03 hòa giải viên trở lên, trong đó có hòa giải viên nữ. Đối với vùng có nhiều đồng bào dân tộc thiểu số, tổ hòa giải phải có hòa giải viên là người dân tộc thiểu số.\u003c/p\u003e\n  \u003cp id=\"c54d3540-2c85-11f1-803e-e7b91124115d\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e2. Chủ tịch Ủy ban nhân dân cấp xã quyết định số lượng tổ hòa giải, hòa giải viên trong một tổ hòa giải căn cứ vào đặc điểm, tình hình kinh tế - xã hội, dân số của địa phương và đề nghị của Ban thường trực Ủy ban Mặt trận Tổ quốc Việt Nam cấp xã.\u003c/p\u003e\n  \u003cp id=\"c54d5c50-2c85-11f1-b4bf-9b455e6165d1\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e3. Hằng năm, Trưởng ban công tác Mặt trận chủ trì phối hợp với tổ trưởng tổ hòa giải tiến hành rà soát, đánh giá về tổ chức, hoạt động của tổ hòa giải và kiến nghị Ban thường trực Ủy ban Mặt trận Tổ quốc Việt Nam cấp xã để đề nghị Ủy ban nhân dân cấp xã kiện toàn tổ hòa giải.\u003c/p\u003e\n  \u003cp id=\"c54d8360-2c85-11f1-a416-517e0149d4d6\" class=\"prov-article\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 13. Trách nhiệm của tổ hòa giải\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"c54daa70-2c85-11f1-a7b9-513c29542933\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e1. Tổ chức thực hiện hòa giải.\u003c/p\u003e\n  \u003cp id=\"c54dd180-2c85-11f1-b994-8bcc3fd6f204\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e2. Tổ chức trao đổi kinh nghiệm, thảo luận các giải pháp để tiến hành hòa giải vụ, việc phức tạp.\u003c/p\u003e\n  \u003cp id=\"c54df890-2c85-11f1-8561-894c5535a2d0\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e3. Phối hợp với Ban công tác Mặt trận, Chi hội phụ nữ, Chi đoàn thanh niên, Chi hội cựu chiến binh, Chi hội nông dân, Chi hội người cao tuổi, các tổ hòa giải và tổ chức, cá nhân khác trong hoạt động hòa giải ở cơ sở.\u003c/p\u003e\n  \u003cp id=\"c54e46b0-2c85-11f1-be56-d169a527485e\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e4. Kiến nghị với Ủy ban Mặt trận Tổ quốc Việt Nam cấp xã, Uỷ ban nhân dân cấp xã về hoạt động hòa giải ở cơ sở, các điều kiện cần thiết cho hoạt động hòa giải ở cơ sở.\u003c/p\u003e\n  \u003cp id=\"c54e6dc0-2c85-11f1-a58d-4f51301c3ce2\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e5. Đề nghị khen thưởng tổ hòa giải, hòa giải viên có thành tích xuất sắc trong công tác hòa giải.\u003c/p\u003e\n  \u003cp id=\"c54e94d0-2c85-11f1-a0a2-cf1cfae2516e\" class=\"prov-article\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 14. Tổ trưởng tổ hòa giải \u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"c54ebbe0-2c85-11f1-b589-2fa2f7b6de14\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e1. Tổ trưởng tổ hòa giải do hòa giải viên bầu trong số các hòa giải viên để phụ trách tổ hòa giải.\u003c/p\u003e\n  \u003cp id=\"c54ee2f0-2c85-11f1-b76a-1912215122d2\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e2. Việc bầu tổ trưởng tổ hòa giải được thực hiện dưới sự chủ trì của Trưởng ban công tác Mặt trận bằng hình thức biểu quyết công khai hoặc bỏ phiếu kín. Kết quả bầu tổ trưởng tổ hòa giải được lập thành văn bản và gửi Chủ tịch Ủy ban nhân dân cấp xã để ra quyết định công nhận.\u003c/p\u003e\n  \u003cp id=\"c54f0a00-2c85-11f1-9d66-dfa5a2b9eea1\" class=\"prov-article\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 15. Quyền và nghĩa vụ của tổ trưởng tổ hòa giải \u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"c54f3110-2c85-11f1-9e75-6d7d87179add\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e1. \u003cstrong\u003e\u003cem\u003e \u003c/em\u003e\u003c/strong\u003ePhân công, phối hợp hoạt động của các hòa giải viên.\u003c/p\u003e\n  \u003cp id=\"c54f5820-2c85-11f1-8f4c-b711ede7e9e1\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e2. Đại diện cho tổ hòa giải trong quan hệ với Trưởng ban công tác Mặt trận, trưởng thôn, tổ trưởng tổ dân phố và cơ quan, tổ chức, cá nhân khác trong thực hiện trách nhiệm của tổ hòa giải.\u003c/p\u003e\n  \u003cp id=\"c54f7f30-2c85-11f1-bf47-ffffac40623f\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e3. Đề nghị cho thôi làm hòa giải viên theo quy định tại khoản 2 Điều 11 của Luật này.\u003c/p\u003e\n  \u003cp id=\"c54fa640-2c85-11f1-8216-15bc2430eba8\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e4. Báo cáo kịp thời với Chủ tịch Ủy ban nhân dân cấp xã và cơ quan có thẩm quyền về các vụ, việc theo quy định tại khoản 4 và khoản 5 Điều 10 của Luật này.\u003c/p\u003e\n  \u003cp id=\"c54fcd50-2c85-11f1-812b-598ca3ef24c3\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e5. Báo cáo hằng năm và báo cáo đột xuất về tổ chức và hoạt động của tổ hòa giải với Ủy ban nhân dân, Ban thường trực Ủy ban Mặt trận Tổ quốc Việt Nam cấp xã.\u003c/p\u003e\n  \u003cp id=\"c54ff460-2c85-11f1-b75b-4d338d7a56b8\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e6. Phối hợp với tổ trưởng tổ hòa giải khác để trao đổi kinh nghiệm hoặc tiến hành hòa giải những vụ, việc liên quan đến các thôn, tổ dân phố khác nhau.\u003c/p\u003e\n  \u003cp id=\"c54ff46a-2c85-11f1-a708-db8ba5588ff3\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e7. Có các quyền, nghĩa vụ của hòa giải viên quy định tại Điều 9 và Điều 10 của Luật này.\u003c/p\u003e\n  \u003cp id=\"c54ff474-2c85-11f1-a646-9b34a1ffa3d1\" class=\"prov-chapter\" align=\"center\" style=\"font-family: 'Times New Roman', serif; font-size: 14px; text-align: center;\"\u003e\u003cstrong\u003eChương III\u003cbr\u003e\n     HOẠT ĐỘNG HÒA GIẢI Ở CƠ SỞ\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"c54ff47e-2c85-11f1-98f0-e3873f210145\" class=\"prov-article\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 16. Căn cứ tiến hành hòa giải\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003eHòa giải ở cơ sở được tiến hành khi có một trong các căn cứ sau đây:\u003c/p\u003e\n  \u003cp id=\"c54ff488-2c85-11f1-baa6-6b17d5d8d243\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e1. Một bên hoặc các bên yêu cầu hòa giải;\u003c/p\u003e\n  \u003cp id=\"c54ff492-2c85-11f1-9a44-25eea8cd247b\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e2. Hòa giải viên chứng kiến hoặc biết vụ, việc thuộc phạm vi hòa giải;\u003c/p\u003e\n  \u003cp id=\"c54ff49c-2c85-11f1-a635-7da3800c070f\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e3. Theo phân công của tổ trưởng tổ hòa giải hoặc đề nghị của cơ quan, tổ chức, cá nhân có liên quan.\u003c/p\u003e\n  \u003cp id=\"c54ff4a6-2c85-11f1-b5ae-d170c6c87cce\" class=\"prov-article\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 17. Quyền và nghĩa vụ của các bên trong hòa giải\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"c54ff4b0-2c85-11f1-b243-5ddba58c7f24\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e1. Lựa chọn, đề xuất hòa giải viên, địa điểm, thời gian để tiến hành hòa giải.\u003c/p\u003e\n  \u003cp id=\"c54ff4ba-2c85-11f1-8b00-f3a890567a55\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e2. Đồng ý hoặc từ chối hòa giải; yêu cầu tạm dừng hoặc chấm dứt hòa giải.\u003c/p\u003e\n  \u003cp id=\"c551a210-2c85-11f1-ac51-9d2041d05b17\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e3. Yêu cầu việc hòa giải được tiến hành công khai hoặc không công khai.\u003c/p\u003e\n  \u003cp id=\"c551a21a-2c85-11f1-8f57-2f3b200d7fef\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e4. Được bày tỏ ý chí và quyết định về nội dung giải quyết hòa giải.\u003c/p\u003e\n  \u003cp id=\"c551a224-2c85-11f1-a7b5-b13cc52f162f\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e5. Trình bày đúng sự thật các tình tiết của vụ, việc; cung cấp tài liệu, chứng cứ có liên quan.\u003c/p\u003e\n  \u003cp id=\"c551a22e-2c85-11f1-a9e6-8ba42d763d08\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e6. Tôn trọng hòa giải viên, quyền của các bên có liên quan.\u003c/p\u003e\n  \u003cp id=\"c551a238-2c85-11f1-aaf6-3b8145013595\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e7. Không gây ảnh hưởng đến an ninh, trật tự tại địa điểm hòa giải.\u003c/p\u003e\n  \u003cp id=\"c551a242-2c85-11f1-a90b-d95f31eb86bd\" class=\"prov-article\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 18. Phân công hòa giải viên \u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"c551a24c-2c85-11f1-a999-0d02713bfd9e\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e1. Tổ trưởng tổ hòa giải phân công hòa giải viên tiến hành hòa giải trong trường hợp các bên không lựa chọn hòa giải viên.\u003c/p\u003e\n  \u003cp id=\"c551a256-2c85-11f1-aaee-e59f863bd470\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e2. Tổ trưởng tổ hòa giải không phân công hòa giải viên tiến hành hòa giải nếu có căn cứ cho rằng hòa giải viên có quyền, lợi ích, nghĩa vụ liên quan đến vụ, việc hòa giải hoặc có lý do khác dẫn đến không thể bảo đảm khách quan, công bằng trong hòa giải.\u003c/p\u003e\n  \u003cp id=\"c551a260-2c85-11f1-806b-4d6bebb08ad7\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e3. Trong quá trình hòa giải, nếu hòa giải viên vi phạm nguyên tắc hoạt động hòa giải hoặc nghĩa vụ khác của hòa giải viên thì tổ trưởng tổ hòa giải phân công hòa giải viên khác thực hiện việc hòa giải.\u003c/p\u003e\n  \u003cp id=\"c551a26a-2c85-11f1-9f4a-e94164c8f568\" class=\"prov-article\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 19. Người được mời tham gia hòa giải\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"c551a274-2c85-11f1-b978-4f8414ac76b4\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e1. Trong quá trình hòa giải, nếu thấy cần thiết, hòa giải viên và một trong các bên khi được sự đồng ý của bên kia có thể mời người có uy tín trong dòng họ, ở nơi sinh sống, nơi làm việc; người có trình độ pháp lý, có kiến thức xã hội; già làng , chức sắc tôn giáo, người biết rõ vụ, việc; đại diện của cơ quan, tổ chức hoặc người có uy tín khác tham gia hòa giải.\u003c/p\u003e\n  \u003cp id=\"c551a27e-2c85-11f1-88e4-4d7fcb045525\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e2. Người được mời tham gia hòa giải phải tuân thủ các nguyên tắc hoạt động hòa giải ở cơ sở.\u003c/p\u003e\n  \u003cp id=\"c551a288-2c85-11f1-af5c-fd9030ec9f6d\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e3. Cơ quan, tổ chức có người được mời tham gia hòa giải có trách nhiệm tạo điều kiện để họ tham gia hòa giải.\u003c/p\u003e\n  \u003cp id=\"c551a292-2c85-11f1-a829-a7a21a2f07ca\" class=\"prov-article\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 20. Địa điểm, thời gian hòa giải\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"c5541310-2c85-11f1-bb79-b57bd551ece6\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e1. Địa điểm hòa giải là nơi xảy ra vụ, việc hoặc nơi do các bên hoặc hòa giải viên lựa chọn, bảo đảm thuận lợi cho các bên.\u003c/p\u003e\n  \u003cp id=\"c554131a-2c85-11f1-9976-d32c8c7bce2e\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e2. Trong thời hạn 03 ngày, kể từ ngày được phân công, hòa giải viên bắt đầu tiến hành hòa giải, trừ trường hợp cần thiết phải hòa giải ngay khi chứng kiến vụ, việc hoặc các bên có thỏa thuận khác về thời gian hòa giải.\u003c/p\u003e\n  \u003cp id=\"c5541324-2c85-11f1-a56f-b7a9462d0fdf\" class=\"prov-article\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 21. Tiến hành hòa giải\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"c554132e-2c85-11f1-8035-1be05ceb227d\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e1. Hòa giải được tiến hành trực tiếp, bằng lời nói với sự có mặt của các bên. Trong trường hợp các bên có người khuyết tật thì có sự hỗ trợ phù hợp để có thể tham gia hòa giải.\u003c/p\u003e\n  \u003cp id=\"c5541338-2c85-11f1-8759-dbb4d4eb0ea7\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e2. Hòa giải được tiến hành công khai hoặc không công khai theo ý kiến thống nhất của các bên.\u003c/p\u003e\n  \u003cp id=\"c5541342-2c85-11f1-97e9-69a2569cbcbc\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e3. Tùy thuộc vào vụ, việc cụ thể, trên cơ sở quy định của pháp luật, đạo đức xã hội, phong tục, tập quán tốt đẹp của nhân dân, hòa giải viên áp dụng các biện pháp thích hợp nhằm giúp các bên hiểu rõ về quyền lợi, trách nhiệm của mỗi bên trong vụ, việc để các bên thỏa thuận việc giải quyết các mâu thuẫn, tranh chấp và tự nguyện thực hiện thỏa thuận đó.\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003eTrong trường hợp không đạt được thỏa thuận, hòa giải viên hướng dẫn các bên đề nghị cơ quan, tổ chức có thẩm quyền giải quyết theo quy định của pháp luật.\u003c/p\u003e\n  \u003cp id=\"c554134c-2c85-11f1-95fe-496170d2bf8f\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e4. Hòa giải viên có trách nhiệm ghi nội dung vụ, việc hòa giải vào Sổ theo dõi hoạt động hòa giải ở cơ sở.\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003eTrường hợp các bên đồng ý thì lập văn bản hòa giải thành theo quy định tại khoản 2 Điều 24 của Luật này.\u003c/p\u003e\n  \u003cp id=\"c5541356-2c85-11f1-84a0-636ede5524fc\" class=\"prov-article\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 22. Hòa giải giữa các bên ở thôn, tổ dân phố khác nhau\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003eTrường hợp các bên ở thôn, tổ dân phố khác nhau thì tổ hòa giải ở thôn, tổ dân phố đó phối hợp thực hiện việc hòa giải và thông báo với Trưởng ban công tác Mặt trận tại nơi đó cùng phối hợp thực hiện.\u003c/p\u003e\n  \u003cp id=\"c5541360-2c85-11f1-9a77-c17d4b8b6491\" class=\"prov-article\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 23. Kết thúc hòa giải \u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"c554136a-2c85-11f1-b996-ffc392a9a1bf\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e1. Các bên đạt được thỏa thuận.\u003c/p\u003e\n  \u003cp id=\"c5541374-2c85-11f1-84e3-6390dd9a8efb\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e2. Một bên hoặc các bên yêu cầu chấm dứt hòa giải.\u003c/p\u003e\n  \u003cp id=\"c554137e-2c85-11f1-becb-ef0ed2cb7047\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e3. Hòa giải viên quyết định kết thúc hòa giải khi các bên không thể đạt được thỏa thuận và việc tiếp tục hòa giải cũng không thể đạt được kết quả.\u003c/p\u003e\n  \u003cp id=\"c5541388-2c85-11f1-bded-dbb7184ecc65\" class=\"prov-article\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 24. Hòa giải thành\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"c5541392-2c85-11f1-819d-ed4eb8e4259f\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e1. Hòa giải thành là trường hợp các bên đạt được thỏa thuận.\u003c/p\u003e\n  \u003cp id=\"c5565d00-2c85-11f1-8afe-ff0003bcaddc\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e2. Các bên có thể thỏa thuận lập văn bản hòa giải thành gồm các nội dung chính sau đây:\u003c/p\u003e\n  \u003cp id=\"c5565d0a-2c85-11f1-9bbb-27c9b83e1325\" class=\"prov-item\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003ea) Căn cứ tiến hành hòa giải;\u003c/p\u003e\n  \u003cp id=\"c5565d14-2c85-11f1-9372-dfe33470be29\" class=\"prov-item\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003eb) Thông tin cơ bản về các bên;\u003c/p\u003e\n  \u003cp id=\"c5565d1e-2c85-11f1-981d-b1d6b6a04539\" class=\"prov-item\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003ec) Nội dung chủ yếu của vụ, việc;\u003c/p\u003e\n  \u003cp id=\"c5565d28-2c85-11f1-afff-9748f1acb4c1\" class=\"prov-item\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003ed) Diễn biến của quá trình hòa giải;\u003c/p\u003e\n  \u003cp id=\"c5565d32-2c85-11f1-81eb-6d908957a6f0\" class=\"prov-item\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003eđ) Thỏa thuận đạt được và giải pháp thực hiện;\u003c/p\u003e\n  \u003cp id=\"c5565d3c-2c85-11f1-8968-0db3150b555b\" class=\"prov-item\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003ee) Quyền và nghĩa vụ của các bên;\u003c/p\u003e\n  \u003cp id=\"c5565d46-2c85-11f1-aef8-cfe5d16cf4c1\" class=\"prov-item\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003eg) Phương thức, thời hạn thực hiện thỏa thuận;\u003c/p\u003e\n  \u003cp id=\"c5565d50-2c85-11f1-b229-9fafd5052d16\" class=\"prov-item\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003eh) Chữ ký hoặc điểm chỉ của các bên và của hòa giải viên.\u003c/p\u003e\n  \u003cp id=\"c5565d5a-2c85-11f1-b12c-a1bec878cd6c\" class=\"prov-article\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 25. Thực hiện thỏa thuận hòa giải thành\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"c5565d64-2c85-11f1-96e5-4726abfd3801\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e1. Các bên có trách nhiệm thực hiện thỏa thuận hòa giải thành.\u003c/p\u003e\n  \u003cp id=\"c5565d6e-2c85-11f1-8398-b92285ea02e9\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e2. Trong quá trình thực hiện thỏa thuận hòa giải thành, nếu một bên vì sự kiện bất khả kháng không thể thực hiện được thì có trách nhiệm trao đổi, thỏa thuận với bên kia và thông báo cho hòa giải viên.\u003c/p\u003e\n  \u003cp id=\"c5565d78-2c85-11f1-bc19-29a4e6d5b8f7\" class=\"prov-article\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 26. Theo dõi, đôn đốc việc thực hiện thỏa thuận hòa giải thành\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003eHòa giải viên có trách nhiệm theo dõi, đôn đốc việc thực hiện thỏa thuận hòa giải thành do mình trực tiếp giải quyết; kịp thời thông báo cho tổ trưởng tổ hòa giải để báo cáo Trưởng ban công tác Mặt trận những vấn đề phát sinh trong quá trình theo dõi, đôn đốc thực hiện.\u003c/p\u003e\n  \u003cp id=\"c5565d82-2c85-11f1-b9f0-7d3ab650b0fc\" class=\"prov-article\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 27. Hòa giải không thành\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003eHòa giải không thành là trường hợp các bên không đạt được thỏa thuận.\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003eTrong trường hợp này, các bên có quyền yêu cầu tiếp tục hòa giải hoặc yêu cầu cơ quan, tổ chức có thẩm quyền giải quyết theo quy định của pháp luật.\u003c/p\u003e\n  \u003cp id=\"c5565d8c-2c85-11f1-bf2a-b561744c2788\" class=\"prov-chapter\" align=\"center\" style=\"font-family: 'Times New Roman', serif; font-size: 14px; text-align: center;\"\u003e\u003cstrong\u003eChương IV\u003cbr\u003e\n     TRÁCH NHIỆM CỦA CƠ QUAN, TỔ CHỨC\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"c5565d8c-2c85-11f1-bf2a-b561744c2788\" class=\"prov-chapter\" align=\"center\" style=\"font-family: 'Times New Roman', Times, serif; font-size: 14px; text-align: center;\"\u003e\u003cstrong\u003eTRONG HOẠT ĐỘNG HÒA GIẢI Ở CƠ SỞ\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"c558ce00-2c85-11f1-bb2c-6dc48b35150b\" class=\"prov-article\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 28. Trách nhiệm\u003c/strong\u003e \u003cstrong\u003equản lý nhà nước về hòa giải ở cơ sở\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"c558f510-2c85-11f1-95e9-49f9b777aaaa\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e1. Chính phủ thống nhất quản lý nhà nước về hòa giải ở cơ sở.\u003c/p\u003e\n  \u003cp id=\"c5591c20-2c85-11f1-9430-11f31b1a2d50\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e2. Bộ Tư pháp chịu trách nhiệm trước Chính phủ thực hiện quản lý nhà nước về hòa giải ở cơ sở, có trách nhiệm sau đây:\u003c/p\u003e\n  \u003cp id=\"c5594330-2c85-11f1-995b-cd41f004e8ae\" class=\"prov-item\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003ea) Xây dựng, trình cơ quan có thẩm quyền ban hành hoặc ban hành theo thẩm quyền văn bản quy phạm pháp luật về hòa giải ở cơ sở;\u003c/p\u003e\n  \u003cp id=\"c5599150-2c85-11f1-aa92-7753865c5502\" class=\"prov-item\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003eb) Chủ trì, phối hợp với các bộ, cơ quan ngang bộ, cơ quan thuộc Chính phủ, Ủy ban Trung ương Mặt trận Tổ quốc Việt Nam chỉ đạo, hướng dẫn, tổ chức, kiểm tra thực hiện văn bản quy phạm pháp luật về hòa giải ở cơ sở;\u003c/p\u003e\n  \u003cp id=\"c559915a-2c85-11f1-9246-0b329ecd879b\" class=\"prov-item\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003ec) Biên soạn, phát hành tài liệu, tổ chức bồi dưỡng, hướng dẫn nghiệp vụ, kỹ năng thực hiện công tác quản lý nhà nước về hòa giải ở cơ sở cho cấp tỉnh;\u003c/p\u003e\n  \u003cp id=\"c559df70-2c85-11f1-abb3-438089841009\" class=\"prov-item\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003ed) Quy định mẫu Sổ theo dõi hoạt động hòa giải ở cơ sở; mẫu, biểu thống kê về tổ chức, hoạt động hòa giải ở cơ sở.\u003c/p\u003e\n  \u003cp id=\"c55a0680-2c85-11f1-af88-3dbab230fedc\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e3. Các bộ, cơ quan ngang bộ trong phạm vi nhiệm vụ, quyền hạn của mình có trách nhiệm phối hợp với Bộ Tư pháp thực hiện quản lý nhà nước về hòa giải ở cơ sở.\u003c/p\u003e\n  \u003cp id=\"c55a2d90-2c85-11f1-8c41-8b018b34a9af\" class=\"prov-article\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 29. Trách nhiệm của Ủy ban nhân dân các cấp\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"c55a54a0-2c85-11f1-bc66-3f0e0011d62f\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e1. Ủy ban nhân dân tỉnh, thành phố trực thuộc Trung ương, Ủy ban nhân dân huyện, quận, thị xã, thành phố thuộc tỉnh (sau đây gọi chung là cấp huyện) trong phạm vi nhiệm vụ, quyền hạn của mình có trách nhiệm thực hiện quản lý nhà nước về hòa giải ở cơ sở tại địa phương; trình dự toán kinh phí hỗ trợ cho công tác hòa giải ở cơ sở tại địa phương để Hội đồng nhân dân có thẩm quyền xem xét quyết định; tổ chức bồi dưỡng, hướng dẫn nghiệp vụ và kỹ năng hòa giải ở cơ sở cho hòa giải viên theo hướng dẫn của Bộ Tư pháp.\u003c/p\u003e\n  \u003cp id=\"c55a54aa-2c85-11f1-8658-595b9b75298e\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e2. Ủy ban nhân dân cấp xã có trách nhiệm:\u003c/p\u003e\n  \u003cp id=\"c55a54b4-2c85-11f1-bf5d-0d82732b906a\" class=\"prov-item\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003ea) Chủ trì, phối hợp với Ủy ban Mặt trận Tổ quốc Việt Nam cùng cấp tổ chức thực hiện các văn bản pháp luật về hòa giải ở cơ sở; xây dựng dự toán kinh phí hỗ trợ cho hoạt động hòa giải; thành lập, kiện toàn tổ hòa giải và công nhận tổ trưởng tổ hòa giải, hòa giải viên tại địa phương;\u003c/p\u003e\n  \u003cp id=\"c55a54be-2c85-11f1-811f-f5405c0275ae\" class=\"prov-item\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003eb) Chủ trì phối hợp với Ủy ban Mặt trận Tổ quốc Việt Nam cùng cấp tổ chức kiểm tra, sơ kết, tổng kết và khen thưởng về hòa giải ở cơ sở.\u003c/p\u003e\n  \u003cp id=\"c55a54c8-2c85-11f1-b5bf-23bb7bb04811\" class=\"prov-item\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003ec) Báo cáo Hội đồng nhân dân cùng cấp, Ủy ban nhân dân cấp huyện kết quả thực hiện pháp luật về hòa giải ở cơ sở.\u003c/p\u003e\n  \u003cp id=\"c55a54d2-2c85-11f1-97cd-67d322db2130\" class=\"prov-article\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 30. Trách nhiệm của Ủy ban Mặt trận Tổ quốc Việt Nam các cấp và các tổ chức thành viên của Mặt trận\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"c55b3f00-2c85-11f1-8241-03542943bd91\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e1. Ủy ban Mặt trận Tổ quốc Việt Nam các cấp tham gia quản lý nhà nước về hòa giải ở cơ sở; vận động tổ chức, cá nhân chấp hành pháp luật, giám sát việc thực hiện pháp luật về hòa giải ở cơ sở; phối hợp kiểm tra, sơ kết, tổng kết và khen thưởng về hòa giải ở cơ sở.\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003eỦy ban Trung ương Mặt trận Tổ quốc Việt Nam hướng dẫn Ủy ban Mặt trận Tổ quốc Việt Nam các cấp tham gia tổ chức thực hiện pháp luật về hòa giải ở cơ sở.\u003c/p\u003e\n  \u003cp id=\"c55b3f0a-2c85-11f1-8a3e-5342463a7a60\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e2. Các tổ chức thành viên của Mặt trận trong phạm vi chức năng, nhiệm vụ của mình có trách nhiệm thực hiện hoạt động hòa giải ở cơ sở theo quy định của pháp luật.\u003c/p\u003e\n  \u003cp id=\"c55b3f14-2c85-11f1-9be1-ad21c4736963\" class=\"prov-chapter\" align=\"center\" style=\"font-family: 'Times New Roman', serif; font-size: 14px; text-align: center;\"\u003e\u003cstrong\u003eChương V\u003cem\u003e\u003cbr\u003e\u003c/em\u003eĐIỀU KHOẢN THI HÀNH\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"c55b3f1e-2c85-11f1-8a81-131e803cf6f3\" class=\"prov-article\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 31. Quy định chuyển tiếp\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003eKể từ ngày Luật này có hiệu lực, các tổ hòa giải, tổ viên tổ hòa giải được thành lập, công nhận theo Pháp lệnh về tổ chức và hoạt động hòa giải ở cơ sở được tiếp tục hoạt động mà không phải làm thủ tục công nhận lại theo quy định của Luật này.\u003c/p\u003e\n  \u003cp id=\"c55b3f28-2c85-11f1-965f-cd0266d0fd94\" class=\"prov-article\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 32. Hiệu lực thi hành\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"c55b3f32-2c85-11f1-b3df-c73a88414ea5\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e1. Luật này có hiệu lực từ ngày 01 tháng 01 năm 2014.\u003c/p\u003e\n  \u003cp id=\"c55b3f3c-2c85-11f1-b1bb-d5b189aca74a\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e2. Pháp lệnh về tổ chức và hoạt động hòa giải ở cơ sở hết hiệu lực kể từ ngày Luật này có hiệu lực.\u003c/p\u003e\n  \u003cp id=\"c55b3f46-2c85-11f1-b52d-5126a388f68f\" class=\"prov-article\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 33. Quy định chi tiết và hướng dẫn thi hành \u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003eChính phủ quy định chi tiết, hướng dẫn thi hành các điều, khoản được giao trong Luật.\u003c/p\u003e\n  \u003cp style=\"font-family: 'Times New Roman', serif; font-size: 14px;\"\u003e\u003cem\u003eLuật này đã được Quốc hội nước Cộng hòa xã hội chủ nghĩa Việt Nam khóa XIII, kỳ họp thứ 5 thông qua ngày 20 tháng 6 năm 2013.\u003c/em\u003e\u003c/p\u003e\n  \u003cp align=\"center\" style=\"font-family: 'Times New Roman', serif; font-size: 14px; text-align: center;\"\u003e\u003cstrong\u003e\u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp;CHỦ TỊCH QUỐC HỘI\u003c/strong\u003e\u003c/p\u003e\n  \u003cp align=\"center\" style=\"font-family: 'Times New Roman', serif; font-size: 14px; text-align: center;\"\u003e\u003cstrong\u003e\u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; (Đã ký )\u003c/strong\u003e\u003c/p\u003e\n  \u003cp align=\"center\" style=\"font-family: 'Times New Roman', serif; font-size: 14px; text-align: center;\"\u003e\u003cstrong\u003e\u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; Nguyễn Sinh Hùng\u003c/strong\u003e\u003c/p\u003e\n \u003c/body\u003e\n\u003c/html\u003e"])</script><script>self.__next_f.push([1,"d:[[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"Legislation\\\",\\\"name\\\":\\\"Luật Hòa giải ở cơ sở số 35/2013/QH13\\\",\\\"legislationIdentifier\\\":\\\"35/2013/QH13\\\",\\\"legislationType\\\":\\\"Luật\\\",\\\"legislationDate\\\":\\\"2013-06-20T00:00:00\\\",\\\"legislationLegalForce\\\":\\\"InForce\\\",\\\"legislationPassedBy\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Quốc hội\\\"},\\\"legislationJurisdiction\\\":\\\"VN\\\",\\\"url\\\":\\\"https://vbpl.vn/van-ban/chi-tiet/luat-hoa-giai-o-co-so-so-35-2013-qh13--32515\\\",\\\"inLanguage\\\":\\\"vi\\\",\\\"keywords\\\":\\\"Luật, Phổ biến, giáo dục pháp luật, Quốc hội, văn bản pháp luật, pháp luật Việt Nam\\\"}\"}}],[\"$\",\"script\",\"breadcrumb-jsonld\",{\"type\":\"application/ld+json\",\"id\":\"breadcrumb-jsonld\",\"data-testid\":\"$undefined\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"BreadcrumbList\\\",\\\"itemListElement\\\":[{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":1,\\\"name\\\":\\\"Trang chủ\\\",\\\"item\\\":\\\"https://vbpl.vn\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":2,\\\"name\\\":\\\"Văn
