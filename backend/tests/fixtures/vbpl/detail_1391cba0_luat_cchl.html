-21a5-41a0-a3ae-9edfa931f7b1\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.079;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e2. Trong thời hạn 03 ngày, kể từ ngày được phân công hoặc tiếp nhận vụ, việc, hòa giải viên bắt đầu tiến hành hòa giải, trừ trường hợp cần thiết phải hòa giải ngay khi biết, chứng kiến vụ, việc hoặc các bên có thỏa thuận khác về thời gian hòa giải.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"e66daf75-a7fb-4295-b904-d8d68126221d\" class=\"prov-article\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.079;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eĐiều 26. Hình thức tiến hành và hỗ trợ tham gia hòa giải\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"88c7ce8b-8ee8-4f49-94bd-58de5f0edc94\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.079;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e1. Hòa giải được tiến hành bằng hình thức trực tiếp, trực tuyến hoặc kết hợp trực tiếp và trực tuyến. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.079;\" id=\"88c7ce8b-8ee8-4f49-94bd-58de5f0edc94\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003eTrường hợp các bên có người dân tộc thiểu số, người khuyết tật cần phải hỗ trợ phiên dịch thì bố trí người phiên dịch hoặc người biết ngôn ngữ ký hiệu, chữ dành riêng cho người khuyết tật để dịch lại và người này được coi là người phiên dịch. Người phiên dịch có trách nhiệm tuân thủ các nguyên tắc quy định tại Điều 4 của Luật này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.079;\" id=\"88c7ce8b-8ee8-4f49-94bd-58de5f0edc94\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003eTrường hợp các bên có người khuyết tật thì được hỗ trợ phù hợp để tham gia hòa giải.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"46d61c3c-701a-4a53-b2b7-9c036c4c73af\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.079;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e2. Hòa giải được tiến hành công khai hoặc không công khai theo ý kiến thống nhất của các bên.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"6a941169-402f-4827-a333-d064f36ce07d\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.079;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e3. Tùy thuộc vào vụ, việc cụ thể, trên cơ sở đạo đức xã hội, phong tục, tập quán tốt đẹp của Nhân dân và quy định của pháp luật, hòa giải viên áp dụng các biện pháp thích hợp nhằm giúp các bên hiểu rõ về quyền lợi, trách nhiệm của mỗi bên trong vụ, việc để các bên thỏa thuận việc giải quyết các mâu thuẫn, tranh chấp và tự nguyện thực hiện thỏa thuận.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"b83e4a57-16bc-4552-ba7b-758aa1172811\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.079;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e4. Chính phủ quy định chi tiết khoản 1 Điều này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"736f1f5b-9a4d-4893-8c99-069866ea5ddd\" class=\"prov-article\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eĐiều 27. Hòa giải giữa các bên cư trú tại thôn, tổ dân phố khác nhau\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\" id=\"736f1f5b-9a4d-4893-8c99-069866ea5ddd\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003eTrường hợp các bên cư trú tại thôn, tổ dân phố khác nhau thì tổ hòa giải nơi có vụ, việc hoặc nơi tiếp nhận đề nghị hòa giải chủ trì tổ chức hòa giải và thông báo với Trưởng ban công tác Mặt trận nơi có các bên liên quan cử tổ hòa giải phối hợp tổ chức hòa giải.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"5b9182df-cc58-47a2-9ad6-61420e56f8b0\" class=\"prov-article\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eĐiều 28. Kết thúc hòa giải \u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"fdf5b2d2-7b2b-4bda-adcb-65477f4bede4\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e1. Việc hòa giải kết thúc khi hòa giải thành.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"68c03a23-81ca-40bf-ad90-d2383fa75b15\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e2. Việc hòa giải kết thúc khi hòa giải không thành nếu thuộc một trong các trường hợp sau đây:\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"608be8c3-c155-4daf-b42c-fb5fe7d9fb93\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003ea) Một bên hoặc các bên yêu cầu chấm dứt hòa giải;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8cf7756d-5332-4faf-b460-0f0a2ea5df7d\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003eb) Hòa giải viên quyết định kết thúc hòa giải khi các bên không đạt được thỏa thuận và việc tiếp tục hòa giải cũng không đạt kết quả. Trong trường hợp này, các bên có quyền yêu cầu tiếp tục hòa giải hoặc yêu cầu cơ quan, tổ chức có thẩm quyền giải quyết theo quy định của pháp luật. \u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"d4ccf5f0-45d3-4b51-93d7-85dfdff5726f\" class=\"prov-article\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eĐiều 29. Kết quả hòa giải \u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"ddd44e68-174d-4424-98fa-d84b46be4763\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e1. Kết quả hòa giải được thể hiện bằng lời nói, bằng văn bản hoặc bằng hành vi cụ thể. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\" id=\"ddd44e68-174d-4424-98fa-d84b46be4763\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003eKết quả hòa giải được thể hiện dưới hình thức thông điệp dữ liệu theo quy định của pháp luật về giao dịch điện tử được coi là bằng văn bản.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"6d042f53-289e-4889-b69a-46526cda7d1f\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e2. Trường hợp một trong các bên đồng ý, hòa giải viên lập văn bản về kết quả hòa giải. Văn bản về kết quả hòa giải gồm các nội dung chính sau đây: \u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"ce827be0-bd56-4a50-93e9-1fea4b9423e2\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003ea) Căn cứ tiến hành hòa giải;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"45a58196-645c-4244-9d44-18c22a08996c\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003eb) Thành phần tham gia hòa giải; \u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"defcc57b-be14-4438-99bd-48ec9cae14ab\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003ec) Nội dung chủ yếu của vụ, việc; \u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"139dd147-52d3-4c57-a961-17f7613b8d5e\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003ed) Diễn biến của quá trình hòa giải;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"11eb5de2-5269-41cb-88c5-b45ca6d130d0\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003eđ) Kết quả hòa giải.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"ae1690ef-5c47-4a64-9de0-f537463bf9cd\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e3. Trường hợp hòa giải thành, kết quả hòa giải ghi rõ thỏa thuận đạt được và giải pháp thực hiện; quyền, nghĩa vụ của các bên; phương thức, thời hạn thực hiện thỏa thuận; nội dung khác theo thỏa thuận của các bên phù hợp với quy định của pháp luật.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\" id=\"ae1690ef-5c47-4a64-9de0-f537463bf9cd\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003eTrường hợp hòa giải không thành, kết quả hòa giải ghi rõ ý kiến, quan điểm của các bên và những nội dung khác có liên quan.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\" id=\"ae1690ef-5c47-4a64-9de0-f537463bf9cd\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003eVăn bản về kết quả hòa giải có chữ ký hoặc điểm chỉ hoặc xác nhận của các bên, của hòa giải viên, những người khác tham gia hòa giải (nếu có) và được gửi đến các bên. Trường hợp có người không ký hoặc điểm chỉ hoặc xác nhận thì hòa giải viên ghi rõ lý do trong văn bản.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"842cafa7-ea3f-4419-89ed-0b1f535af245\" class=\"prov-article\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eĐiều 30. Thực hiện thỏa thuận hòa giải thành, công nhận kết quả hòa giải thành\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"415d8bca-a680-4afc-ac20-6c3996fa2133\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e1. Các bên có trách nhiệm thực hiện thỏa thuận hòa giải thành. Trong quá trình thực hiện thỏa thuận hòa giải thành, nếu một bên không thể thực hiện được vì sự kiện bất khả kháng hoặc do lỗi của bên kia hoặc các trường hợp khác theo quy định của pháp luật thì có trách nhiệm trao đổi, thỏa thuận với bên kia và thông báo cho hòa giải viên.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"70979f0d-be73-4a8c-9325-fc32ea409f0f\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.071;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e2. Trường hợp một hoặc các bên yêu cầu Tòa án nhân dân có thẩm quyền công nhận kết quả hòa giải thành thì thực hiện theo quy định của pháp luật về tố tụng dân sự.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"ebcf56f0-5a3d-4c2f-99bc-91259da339b0\" class=\"prov-article\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.071;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eĐiều 31. Theo dõi, đôn đốc việc thực hiện thỏa thuận hòa giải thành\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.071;\" id=\"ebcf56f0-5a3d-4c2f-99bc-91259da339b0\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003eHòa giải viên có trách nhiệm theo dõi, đôn đốc việc thực hiện thỏa thuận hòa giải thành do mình trực tiếp hòa giải; kịp thời thông báo cho Tổ trưởng tổ hòa giải để báo cáo Trưởng ban công tác Mặt trận những vấn đề phát sinh trong quá trình theo dõi, đôn đốc thực hiện.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"fd1b638b-0044-404c-a4ba-36800a16016c\" class=\"prov-chapter\" style=\"text-align: center; margin: 6.0pt 0 6.0pt; line-height: 1.071;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eChương IV\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-chapter\" style=\"text-align: center; margin: 6.0pt 0 6.0pt; line-height: 1.071;\" id=\"fd1b638b-0044-404c-a4ba-36800a16016c\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eTRÁCH NHIỆM CỦA CƠ QUAN, TỔ CHỨC\u003cbr\u003e\n      TRONG HÒA GIẢI Ở CƠ SỞ\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"945d0c88-b9fe-4274-bb57-b8daac45d5a3\" class=\"prov-article\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.071;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eĐiều 32. Trách nhiệm\u003c/strong\u003e \u003cstrong\u003equản lý nhà nước về hòa giải ở cơ sở\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"f5e9c0f5-03cc-4024-9996-d955d5205591\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.071;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e1. Chính phủ thống nhất quản lý nhà nước về hòa giải ở cơ sở trong phạm vi cả nước.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"cfdce555-d965-4710-be14-adbf19d3b692\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.071;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e2. Ủy ban nhân dân các tỉnh, thành phố (sau đây gọi chung là cấp tỉnh) thực hiện quản lý nhà nước về hòa giải ở cơ sở tại tỉnh, thành phố; chủ trì, phối hợp với Ủy ban Mặt trận Tổ quốc Việt Nam cùng cấp hướng dẫn, tổ chức thực hiện pháp luật về hòa giải ở cơ sở tại địa phương; kiểm tra, đánh giá, sơ kết, tổng kết, khen thưởng, báo cáo về hòa giải ở cơ sở.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"107406cf-ed83-460a-8e3f-ca74ea2a5c96\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.071;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e3. Ủy ban nhân dân cấp xã thực hiện quản lý nhà nước về hòa giải ở cơ sở tại địa phương; chủ trì, phối hợp với Ủy ban Mặt trận Tổ quốc Việt Nam cùng cấp tổ chức thực hiện pháp luật về hòa giải ở cơ sở; lồng ghép thực hiện pháp luật về hòa giải ở cơ sở trong xây dựng, thực hiện hương ước, quy ước của thôn, tổ dân phố; kiểm tra, đánh giá, sơ kết, tổng kết, khen thưởng, báo cáo về hòa giải ở cơ sở.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"bd2e1e0f-761c-475a-ba6b-f06b19a14c4d\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.071;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e4. Chính phủ quy định chi tiết Điều này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"3822a47e-68f4-4005-bc65-da77573dfbde\" class=\"prov-article\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.071;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eĐiều 33. Trách nhiệm của Ủy ban Mặt trận Tổ quốc Việt Nam các cấp và các tổ chức thành viên của Mặt trận\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"cd443c48-6651-4256-b5cc-d9a92c4a8f7c\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.071;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e1. Ủy ban Mặt trận Tổ quốc Việt Nam các cấp phối hợp với cơ quan quản lý nhà nước về hòa giải ở cơ sở cùng cấp tham gia thực hiện công tác hòa giải ở cơ sở; vận động tổ chức, cá nhân chấp hành pháp luật, giám sát việc thực hiện pháp luật về hòa giải ở cơ sở; phối hợp kiểm tra, theo dõi, sơ kết, tổng kết, khen thưởng và báo cáo về hòa giải ở cơ sở. \u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.071;\" id=\"cd443c48-6651-4256-b5cc-d9a92c4a8f7c\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003eỦy ban Trung ương Mặt trận Tổ quốc Việt Nam hướng dẫn Ủy ban Mặt trận Tổ quốc Việt Nam các cấp tham gia tổ chức thực hiện pháp luật về hòa giải ở cơ sở.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"dd61318c-9bd2-469b-b8e2-dc931418edc6\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.071;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e2. Các tổ chức thành viên của Mặt trận trong phạm vi chức năng, nhiệm vụ của mình có trách nhiệm thực hiện hoạt động hòa giải ở cơ sở theo quy định của pháp luật; vận động các hội viên, đoàn viên tham gia hòa giải ở cơ sở và làm hòa giải viên.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"918aed15-4594-4d42-ac17-70bd7c21bea2\" class=\"prov-chapter\" style=\"text-align: center; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eChương V\u003cem\u003e\u003cbr\u003e\u003c/em\u003eĐIỀU KHOẢN THI HÀNH\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"20b2b9d5-b571-46c5-8a25-479da3bc921e\" class=\"prov-article\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eĐiều 34. Hiệu lực thi hành\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"d9903ba9-b27b-4292-bb9b-57b139c4ee94\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e1. Luật này có hiệu lực thi hành từ ngày 01 tháng 3 năm 2027.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"d53d38ff-35d4-4b49-bd68-909d4c9085ac\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e2. Luật số \u003ca href=\"/van-ban/chi-tiet/32515\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e35/2013/QH13\u003c/a\u003e hết hiệu lực kể từ ngày Luật này có hiệu lực thi hành, \u003c/span\u003e\u003cspan style=\"color: #000000; font-size: 14.0pt;\"\u003etrừ trường hợp quy định tại khoản 2 Điều 35 của Luật này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"336a6c26-f292-4d7e-a4d6-326c63a83212\" class=\"prov-article\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eĐiều 35. Điều khoản chuyển tiếp\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"08e2456a-36bc-4082-bcb7-f7595f4b5b2b\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e1. Kể từ ngày Luật này có hiệu lực thi hành, các tổ hòa giải, hòa giải viên được thành lập, công nhận theo Luật số \u003ca href=\"/van-ban/chi-tiet/32515\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e35/2013/QH13\u003c/a\u003e được tiếp tục hoạt động mà không phải thành lập, công nhận lại theo quy định của Luật này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"9e585def-15e3-4d31-aee5-cff01e2b4d6b\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e2. Các vụ, việc thuộc phạm vi hòa giải ở cơ sở chưa kết thúc hòa giải trước ngày Luật này có hiệu lực thi hành thì được tiếp tục hòa giải theo quy định của Luật số \u003ca href=\"/van-ban/chi-tiet/32515\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e35/2013/QH13\u003c/a\u003e.\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 5.0pt 0 4.0pt; line-height: 1.05;\" id=\"9e585def-15e3-4d31-aee5-cff01e2b4d6b\"\u003e\u003cspan style=\"font-family: 'Times New Roman Italic', serif; font-size: 14.0pt;\"\u003e\u003cem\u003eLuật này được Quốc hội nước Cộng hòa xã hội chủ nghĩa Việt Nam khóa XVI,\u003c/em\u003e\u003c/span\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e \u003cem\u003eKỳ họp không thường lệ thứ Nhất thông qua ngày 24 tháng 8 năm 2026.\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003ctable border=\"1\" style=\"border-collapse: collapse; wid
