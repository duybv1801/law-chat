ẢN ÁNH, KIẾN NGHỊ VĂN BẢN QPPL\",\"description\":\"PHẢN ÁNH, KIẾN NGHỊ VĂN BẢN QPPL\"}}},\"footer\":{\"unit\":\"Đơn vị chủ quản\",\"unitContent\":\"Bộ Tư pháp\",\"address\":\"Địa chỉ\",\"addressContent\":\"Số 60 Trần Phú - Ba Đình - Thành phố Hà Nội\",\"phoneNumber\":\"Điện thoại\",\"phoneNumberContent\":\"024.6273.9468\",\"fax\":\"Fax\",\"faxContent\":\"024.6273.9359\"},\"underConstruction\":{\"title\":\"Đang cập nhật\",\"message\":\"Chức năng này đang được phát triển.\"},\"gioiThieu\":{\"timeline\":{\"2005\":{\"description\":\"Năm 2005 đánh dấu sự khởi đầu của dự án xây dựng Cơ sở dữ liệu quốc gia về pháp luật, với mục tiêu số hóa và tập trung hóa các văn bản pháp luật của Việt Nam.\"},\"2012-2013\":{\"description\":\"Giai đoạn 2012-2013 là thời kỳ phát triển và mở rộng hệ thống, với việc tích hợp thêm nhiều tính năng và cải thiện giao diện người dùng.\"},\"2023-2025\":{\"description\":\"Giai đoạn 2023-2025 tập trung vào việc nâng cấp và hiện đại hóa hệ thống, áp dụng các công nghệ mới và mở rộng phạm vi phục vụ.\"}},\"overview\":{\"title\":\"SƠ LƯỢC MÔ HÌNH CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"CSDLQG về pháp luật tập hợp các văn bản quy phạm pháp luật và văn bản hợp nhất văn bản quy phạm pháp luật (sau đây gọi chung là văn bản) dưới dạng văn bản điện tử do Chính phủ thống nhất quản lý, có địa chỉ truy cập vbpl.vn, bao gồm các Cơ sở dữ liệu thành phần: Cơ sở dữ liệu văn bản pháp luật Trung ương và Cơ sở dữ liệu văn bản pháp luật địa phương.\",\"central\":{\"title\":\"Cơ sở dữ liệu Văn bản pháp luật Trung ương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của các Bộ, cơ quan ngang Bộ, cơ quan nhà nước khác ở Trung ương ban hành hoặc phối hợp ban hành. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật; Văn bản hợp nhất; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"local\":{\"title\":\"Cơ sở dữ liệu văn bản pháp luật địa phương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của từng tỉnh, thành phố trực thuộc Trung ương trên toàn quốc. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật của Hội đồng nhân dân và Ủy ban nhân dân; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"other\":{\"title\":\"Các chuyên mục khác\",\"content\":\"Ngoài các Cơ sở dữ liệu thành phần kể trên, CSDLQG về pháp luật còn có các chuyên mục khác như: Giới thiệu văn bản mới, Tin tức, Tình huống pháp luật. Ngoài ra, CSDLQG về thủ tục hành chính, bộ pháp điển điện tử, cổng thông tin điện tử Bộ Tư pháp cũng trích xuất về CSDLQG về pháp luật.\"}},\"vision\":{\"title\":\"Tầm nhìn\",\"content\":\"Trở thành nguồn tra cứu văn bản pháp luật chính thống, đầy đủ và đáng tin cậy, phục vụ hiệu quả cho người dân, doanh nghiệp và cơ quan nhà nước.\"},\"mission\":{\"title\":\"Sứ mệnh\",\"content\":\"Cung cấp hệ thống văn bản pháp luật được cập nhật kịp thời, tra cứu thuận tiện, góp phần nâng cao nhận thức pháp luật và bảo đảm việc tuân thủ pháp luật trong xã hội.\"},\"features\":{\"title\":\"MỘT SỐ TÍNH NĂNG, TIỆN ÍCH CỦA CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"Hiện nay, CSDLQG về PL có giao diện tương đối thân thiện, dễ tìm kiếm, dễ khai thác các thông tin và tải về sử dụng. Cơ sở dữ liệu cung cấp các chức năng, tiện ích cơ bản và thuận tiện\",\"list\":[{\"key\":\"fullText\",\"label\":\"Tra cứu toàn văn\",\"icon\":\"SearchOutlined\"},{\"key\":\"tableOfContents\",\"label\":\"Tự động tạo mục lục\",\"icon\":\"BookOutlined\"},{\"key\":\"relatedDocuments\",\"label\":\"Liên kết văn bản liên quan\",\"icon\":\"LinkOutlined\"},{\"key\":\"validity\",\"label\":\"Xác định hiệu lực tự động\",\"icon\":\"BarChartOutlined\"},{\"key\":\"validityHistory\",\"label\":\"Lịch sử hiệu lực\",\"icon\":\"ClockCircleOutlined\"},{\"key\":\"download\",\"label\":\"Tải văn bản\",\"icon\":\"DownloadOutlined\"},{\"key\":\"english\",\"label\":\"Xem văn bản tiếng Anh\",\"icon\":\"GlobalOutlined\"},{\"key\":\"centralLocal\",\"label\":\"Liên kết văn bản Trung ương – địa phương\",\"icon\":\"ShareAltOutlined\"},{\"key\":\"diagram\",\"label\" atic/chunks/5292-beb20880bf4a7330.js\",\"3207\",\"static/chunks/3207-0792bf349fc6782d.js\",\"7287\",\"static/chunks/7287-1e02014aaec038d7.js\",\"2007\",\"static/chunks/2007-dba949ac429f5003.js\",\"4310\",\"static/chunks/app/%5Blocale%5D/van-ban/%5Bcategory%5D/%5Bid%5D/page-75f20aedc57a9c0c.js\"],\"default\"]\n2b:T1699a,"])</script><script>self.__next_f.push([1,"\u003chtml\u003e\n \u003chead\u003e\u003c/head\u003e\n \u003cbody\u003e\n  \u003ctable border=\"0\" class=\"prov-table\" style=\"border-collapse: collapse; width: 100%; margin: 15px 0px; background-color: #ffffff; border-color: #ffffff;\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"padding: 8px; border-color: #ffffff;\"\u003e\n      \u003cp style=\"text-align: center; margin: 0pt 0 0pt; line-height: 18.0pt;\"\u003e\u003cspan style=\"font-size: 13.0pt;\"\u003e\u003cstrong\u003eQUỐC HỘI\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n      \u003cp style=\"text-align: center; margin: 0pt 0 0pt; line-height: 18.0pt;\"\u003e\u003cspan style=\"font-size: 13.0pt;\"\u003eLuật số: 16/2026/QH16\u003c/span\u003e\u003c/p\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"padding: 8px; border-color: #ffffff;\"\u003e\n      \u003cp style=\"text-align: center; margin: 0pt 0 0pt; line-height: 18.0pt;\"\u003e\u003cspan style=\"font-size: 13.0pt;\"\u003e\u003cstrong\u003eCỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n      \u003cp style=\"text-align: center; margin: 0pt 0 0pt; line-height: 18.0pt;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eĐộc lập - Tự do - Hạnh phúc\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp style=\"text-align: center; margin: 0pt 0 0pt;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eLUẬT\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: center; margin: 0pt 0 0pt;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eHÒA GIẢI Ở CƠ SỞ \u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cem\u003eCăn cứ\u0026nbsp;\u003c/em\u003e\u003c/span\u003e\u003cem\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cem\u003eHiến pháp nước Cộng hòa xã hội chủ nghĩa Việt Nam\u003c/em\u003e\u003c/span\u003e\u003c/em\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cem\u003e\u0026nbsp;đã được sửa đổi, bổ sung một số điều theo Nghị quyết số\u0026nbsp;\u003c/em\u003e\u003c/span\u003e\u003cem\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cem\u003e\u003ca href=\"/van-ban/chi-tiet/178314\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e203/2025/QH15\u003c/a\u003e\u003c/em\u003e\u003c/span\u003e\u003c/em\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cem\u003e;\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-family: 'Times New Roman Italic', serif; font-size: 14.0pt;\"\u003e\u003cem\u003eQuốc hội ban hành Luật Hòa giải ở cơ sở. \u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp id=\"0781853a-b6e9-404c-bcbd-6c294bddc391\" class=\"prov-chapter\" style=\"text-align: center; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eChương I \u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-chapter\" style=\"text-align: center; margin: 6.0pt 0 6.0pt; line-height: 1.05;\" id=\"0781853a-b6e9-404c-bcbd-6c294bddc391\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eNHỮNG QUY ĐỊNH CHUNG\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"e4137fbd-7aee-4f7e-b4a1-35d73b4efc3e\" class=\"prov-article\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.029;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eĐiều 1.\u003c/strong\u003e \u003cstrong\u003ePhạm vi điều chỉnh\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"4160f4e4-72a9-408b-9f0c-096590e4f1f3\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.029;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e1. Luật này quy định nguyên tắc, chính sách của Nhà nước về hòa giải ở cơ sở; hòa giải viên, tổ hòa giải, người được mời tham gia hòa giải, các bên trong hòa giải ở cơ sở; hoạt động hòa giải ở cơ sở; trách nhiệm của cơ quan, tổ chức trong hòa giải ở cơ sở.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"e86a3669-e8c5-42c6-a23d-d06a067bc7c5\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.029;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e2. Luật này không áp dụng đối với hoạt động hòa giải của tòa án, trọng tài, hòa giải thương mại, hòa giải lao động, hòa giải tại Ủy ban nhân dân xã, phường, đặc khu (sau đây gọi chung là cấp xã) và hoạt động hòa giải được luật khác quy định. \u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"6ceb2296-ca21-47f3-a57f-ff6ab48201d1\" class=\"prov-article\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.029;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eĐiều 2. Giải thích từ ngữ\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.029;\" id=\"6ceb2296-ca21-47f3-a57f-ff6ab48201d1\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003eTrong Luật này, các từ ngữ dưới đây được hiểu như sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"a587a8b3-20bc-42f9-ab86-86554d7db998\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.029;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e1. \u003cem\u003eHòa giải ở cơ sở\u003c/em\u003e là việc hòa giải viên và người được mời tham gia hòa giải (nếu có) hỗ trợ, giúp đỡ các bên đạt được thỏa thuận, tự nguyện giải quyết mâu thuẫn, tranh chấp, vi phạm pháp luật theo quy định của Luật này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"aa5835ec-a3b9-4353-9bb9-b00a30c49267\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.029;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e2. \u003cem\u003eCơ sở\u003c/em\u003e là thôn, xóm, làng, ấp, bản, buôn, bon, phum, sóc (sau đây gọi chung là thôn); tổ dân phố, khu phố, khối phố, khóm, tiểu khu (sau đây gọi chung là tổ dân phố).\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"85ac7665-7c95-4b7d-8344-b4284072a0cc\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.029;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e3. \u003cem\u003eCác bên\u003c/em\u003e là cá nhân, nhóm cá nhân, hộ gia đình, nhóm hộ gia đình, tổ chức có mâu thuẫn, tranh chấp, vi phạm pháp luật theo quy định của Luật này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"be35a947-ca62-42ce-ae1e-34ce4eeaadc3\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.029;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e4. \u003cem\u003eHòa giải viên\u003c/em\u003e là người được công nhận để thực hiện hoạt động hòa giải ở cơ sở.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"dbc91fbe-eac6-4188-bee5-e4bbe018b218\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.029;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e5. \u003cem\u003eTổ hòa giải\u003c/em\u003e là tổ chức tự quản của Nhân dân được thành lập ở thôn, tổ dân phố để hoạt động hòa giải ở cơ sở.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"0057e5eb-2493-4d4f-8304-3996ef868fc7\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e6. \u003cem\u003eNgười được mời tham gia hòa giải\u003c/em\u003e là cá nhân hoặc đại diện cơ quan, tổ chức thực hiện việc tư vấn, hỗ trợ, trực tiếp tham gia vụ, việc hòa giải cùng hòa giải viên.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8d333a16-6e71-421a-96b1-a347b710d371\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 5.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e7. \u003cem\u003eHòa giải thành\u003c/em\u003e là trường hợp các bên đạt được thỏa thuận thông qua hòa giải ở cơ sở.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"c65d6546-a7b5-49d4-a3bd-eaf1ace76777\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 5.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e8.\u003cem\u003e Hòa giải không thành\u003c/em\u003e là trường hợp các bên không đạt được thỏa thuận sau khi đã hòa giải ở cơ sở.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"6d780322-fc1c-436f-bdce-6f1df83b8caa\" class=\"prov-article\" style=\"text-align: justify; margin: 6.0pt 0 5.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eĐiều 3. Phạm vi hòa giải ở cơ sở\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"ec7c20cf-237c-4673-bc6c-68bf0b23729e\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 5.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e1. Việc hòa giải ở cơ sở được tiến hành đối với các mâu thuẫn, tranh chấp, vi phạm pháp luật, trừ các trường hợp sau đây:\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"d4165681-a6e7-4cc2-af2f-9ab4821ef670\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 5.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003ea) Mâu thuẫn, tranh chấp, vi phạm pháp luật xâm phạm lợi ích quốc gia, dân tộc, lợi ích công cộng theo quy định của pháp luật;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"c8d574e5-e995-4b8d-8810-5999a7e3bd95\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 5.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003eb) Mâu thuẫn, tranh chấp phát sinh từ giao dịch dân sự vi phạm điều cấm của luật hoặc trái đạo đức xã hội theo quy định của pháp luật;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"d7f22d26-7886-4081-a06d-65022285c7d5\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 5.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003ec) Vi phạm pháp luật mà theo quy định bị truy cứu trách nhiệm hình sự hoặc bị xử lý vi phạm hành chính, trừ trường hợp pháp luật có quy định khác;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"a9176c48-630c-4f49-9e50-2f94ae532765\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 5.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003ed) Mâu thuẫn, tranh chấp, vi phạm pháp luật khác không được hòa giải ở cơ sở theo quy định của pháp luật.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"ef058a8b-6c5b-4d30-8132-82f6683c39c1\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 5.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e2. Chính phủ quy định chi tiết Điều này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"74e398d0-9898-427f-bdeb-198ab31674dc\" class=\"prov-article\" style=\"text-align: justify; margin: 6.0pt 0 5.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eĐiều 4. Nguyên tắc tổ chức, hoạt động hòa giải ở cơ sở\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"210ae992-000a-4bfa-acc8-322a22a33637\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 5.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e1. Tôn trọng sự tự nguyện của các bên; không bắt buộc, áp đặt các bên; khách quan, công bằng, kịp thời, có lý, có tình; bảo mật thông tin quy định tại Điều 5 của Luật này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"1bc58683-caf4-493b-ba5d-eb9c7b4a5806\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 5.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e2. Tuân thủ pháp luật, phù hợp với đạo đức xã hội, phong tục, tập quán tốt đẹp; phát huy tinh thần đoàn kết, tương trợ, giúp đỡ lẫn nhau giữa các thành viên trong gia đình, dòng họ, cộng đồng dân cư; quan tâm đến quyền, lợi ích hợp pháp của trẻ em, phụ nữ, người khuyết tật, người cao tuổi và người dân tộc thiểu số.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"a310373e-2593-494b-a7dc-2a8ff572f34b\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 5.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e3. Tôn trọng ý chí, quyền, lợi ích hợp pháp của các bên; không xâm phạm lợi ích quốc gia, dân tộc, lợi ích công cộng, quyền, lợi ích hợp pháp của người khác.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"f4ee6f41-25f0-4bba-8960-a403ae79f97f\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 5.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e4. Bảo đảm bình đẳng giới trong tổ chức và hoạt động hòa giải ở cơ sở.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"b5f51f0b-712e-4c63-971e-0ce2099f03c2\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 5.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e5. Không lợi dụng hòa giải ở cơ sở để ngăn cản các bên liên quan bảo vệ quyền, lợi ích hợp pháp của mình theo quy định của pháp luật hoặc trốn tránh việc bị xử lý vi phạm hành chính, xử lý hình sự, trốn tránh nghĩa vụ với Nhà nước và nghĩa vụ với các cơ quan, tổ chức, cá nhân khác.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"ea9a6179-3c14-4a46-bd16-01ffbd352e0f\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 5.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e6. Hoạt động hòa giải ở cơ sở được tiến hành linh hoạt, thuận lợi cho các bên, phù hợp với tình hình thực tế và đặc điểm của từng vụ, việc hòa giải.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"19d54ef7-7c01-45d4-bcbb-a5bf150c670e\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 5.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e7. Tiếng nói, chữ viết dùng trong hòa giải ở cơ sở là tiếng Việt. Trường hợp các bên là người dân tộc thiểu số dùng tiếng nói, chữ viết của dân tộc mình thì phải có người phiên dịch; các bên là người khuyết tật nghe, nói hoặc khuyết tật nhìn được hỗ trợ để dùng ngôn ngữ ký hiệu, chữ dành riêng cho người khuyết tật.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"bc68e4b4-96c9-4959-9bad-acf32fc9d2e6\" class=\"prov-article\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eĐiều 5. Bảo mật thông tin trong hòa giải ở cơ sở\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"ba39aa60-27d1-4543-a0c7-f4fd0d278e17\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e1. Hòa giải viên, các bên, người được mời tham gia hòa giải, người phiên dịch và cơ quan, tổ chức, cá nhân liên quan khác có trách nhiệm giữ bí mật nhà nước, bí mật thông tin về đời sống riêng tư, bí mật cá nhân, bí mật gia đình, bí mật kinh doanh của các bên và thông tin khác theo quy định của pháp luật, trừ trường hợp có thỏa thuận hoặc pháp luật có quy định khác.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2ccb54-88f3-4f71-9a29-0e03f5547ad4\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e2. Trong quá trình hòa giải chỉ được ghi chép để phục vụ cho việc hòa giải và phải bảo mật nội dung đã ghi chép, không được ghi âm, ghi hình, trừ trường hợp các bên có thoả thuận hoặc pháp luật có quy định khác. \u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"08470b3e-4b8c-40af-8da5-d4ae1ae211d4\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e3. Cơ quan, tổ chức, cá nhân vi phạm quy định tại khoản 1 và khoản 2 Điều này thì bị xử lý theo quy định của pháp luật.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"52274060-4965-49bc-90f8-52a0d5285092\" class=\"prov-article\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eĐiều 6. Chính sách của Nhà nước về hòa giải ở cơ sở\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"0991d5d9-7a31-42db-891a-d486fd122ccf\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e1. Khuyến khích các bên giải quyết mâu thuẫn, tranh chấp thông qua hòa giải ở cơ sở. \u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"423e5379-7020-4f38-9ed2-de4f9a9ca005\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e2. Khuyến khích những người có uy tín trong gia đình, dòng họ, cộng đồng dân cư; người có trình độ pháp lý, có kiến thức chuyên môn, kiến thức xã hội; người biết tiếng nói, chữ viết của người dân tộc thiểu số, ngôn ngữ ký hiệu, chữ dành riêng cho người khuyết tật và những người có uy tín khác tham gia hòa giải ở cơ sở.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"acc6fa5a-672b-40fe-ba2a-16b2d1830771\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e3. Phát huy vai trò nòng cốt của Mặt trận Tổ quốc Việt Nam và các tổ chức thành viên của Mặt trận trong công tác hòa giải ở cơ sở.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"061af03f-58ba-4403-83da-8be9629ba0d5\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e4. Tạo điều kiện cho công tác hòa giải ở cơ sở hoạt động hiệu quả; khuyến khích tổ chức, cá nhân đóng góp, hỗ trợ công tác hòa giải ở cơ sở.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"f7bb18bd-17a7-4134-a2e1-cb5b384c9583\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e5. Khuyến khích ứng dụng công nghệ thông tin, chuyển đổi số; trang bị phương tiện kỹ thuật cho công tác hòa giải ở cơ sở.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"41c4e5dc-6eb6-43d4-87ae-8ccc041d220d\" class=\"prov-article\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eĐiều 7. Kinh phí cho công tác hòa giải ở cơ sở\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"34813f56-aa78-4010-9488-f861ceed2ed0\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e1. Nhà nước bảo đảm kinh phí cho công tác hòa giải ở cơ sở từ nguồn ngân sách nhà nước.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\" id=\"34813f56-aa78-4010-9488-f861ceed2ed0\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003eNgân sách trung ương hỗ trợ đối với các địa phương chưa cân đối được ngân sách để thực hiện công tác hòa giải ở cơ sở theo quy định của pháp luật về ngân sách nhà nước.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"ac080f99-cfbe-40b9-82e0-de18e2068e41\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e2. Khuyến khích các cơ quan, tổ chức, doanh nghiệp, cá nhân sử dụng nguồn kinh phí hợp pháp hỗ trợ công tác hòa giải ở cơ sở.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"850a4a5e-ea24-4196-a946-3fbacf39610b\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e3. Việc quản lý, sử dụng kinh phí cho công tác hòa giải ở cơ sở thực hiện theo quy định của pháp luật về ngân sách nhà nước và quy định khác của pháp luật có liên quan.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"fb8f80cb-30ff-4fe8-9249-b09e1d3d96a6\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e4. Chính phủ quy định chi tiết Điều này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"17a73911-71f5-4eae-b952-8873b68d35cc\" class=\"prov-chapter\" style=\"text-align: center; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eChương II\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-chapter\" style=\"text-align: center; margin: 0pt 0 0pt; line-height: 1.05;\" id=\"17a73911-71f5-4eae-b952-8873b68d35cc\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eHÒA GIẢI VIÊN, TỔ HÒA GIẢI\u003cem\u003e,\u003c/em\u003e NGƯỜI ĐƯỢC MỜI \u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-chapter\" style=\"text-align: center; margin: 0pt 0 0pt; line-height: 1.05;\" id=\"17a73911-71f5-4eae-b952-8873b68d35cc\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eTHAM GIA HÒA GIẢI, CÁC BÊN TRONG HÒA GIẢI Ở CƠ SỞ\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8ec46771-bc53-4ddc-8858-a2ff6bd395e0\" class=\"prov-section\" style=\"text-align: center; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eMục 1\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-section\" style=\"text-align: center; margin: 6.0pt 0 6.0pt; line-height: 1.05;\" id=\"8ec46771-bc53-4ddc-8858-a2ff6bd395e0\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eHÒA GIẢI VIÊN\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"291fd48b-2c35-494f-8ab7-6ecff099f681\" class=\"prov-article\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eĐiều 8. Tiêu chuẩn của hòa giải viên\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"b812a61a-6778-41df-92c1-8bb9b459ca8a\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e1. Là công dân Việt Nam cư trú tại cơ sở. \u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8903c8e7-49a8-4932-9002-1a8678f3c072\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e2. Có năng lực hành vi dân sự đầy đủ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7a4394a4-40fc-453b-833c-fded8c190743\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e3. Có phẩm chất đạo đức tốt, có uy tín trong cộng đồng dân cư.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"9d62d6de-7bab-434a-b04e-70307c86104d\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e4. Có khả năng thuyết phục, vận động Nhân dân; có hiểu biết pháp luật.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"1d1c381d-27df-4e5f-9931-e94665479985\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e5. Không trong thời hạn xử lý kỷ luật, thi hành quyết định xử lý kỷ luật; không trong thời gian bị áp dụng biện pháp xử lý hành chính hoặc bị truy cứu trách nhiệm hình sự hoặc đang chấp hành án hình sự hoặc chưa được xóa án tích. \u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"fc841583-79df-40ad-8561-732d056392ef\" class=\"prov-article\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eĐiều 9. Bầu hòa giải viên\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"d9691d42-97e8-47cc-a1d1-3855f606c9e4\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e1. Người có đủ tiêu chuẩn quy định tại Điều 8 của Luật này tự nguyện tham gia hòa giải ở cơ sở có quyền ứng cử hoặc được Ban công tác Mặt trận phối hợp với các tổ chức thành viên của Mặt trận giới thiệu vào danh sách bầu hòa giải viên.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"95021587-e7b6-4a09-a65a-ff0822cf2233\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e2. Trưởng ban công tác Mặt trận chủ trì, phối hợp với Trưởng thôn, Tổ trưởng tổ dân phố tổ chức bầu hòa giải viên tại thôn, tổ dân phố hoặc tại từng cụm dân cư bằng một hoặc kết hợp một số hình thức sau đây:\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"a2c4982d-acd3-4b95-8fb8-cc6df7dd73f7\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003ea) Biểu quyết công khai hoặc bỏ phiếu kín tại cuộc họp đại diện các hộ gia đình;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"03db683e-1bc3-4034-a0b0-27bb6b1b9727\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003eb) Phát phiếu lấy ý kiến đại diện các hộ gia đình;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"5c86db82-1556-4037-81cf-16059d2e5c38\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003ec) Biểu quyết trực tuyến.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"51e7933e-68b0-4a88-8baa-51e0ab9987d6\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e3. Kết quả bầu hòa giải viên được xác định như sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"45ae05f6-a6a5-41dc-ac62-c53ebb167339\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003ea) Người được đề nghị công nhận là hòa giải viên phải đạt trên 50% tổng số đại diện hộ gia đình trong thôn, tổ dân phố đồng ý;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"1b5711ac-2856-410e-97e9-377d70ad0158\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003eb) Trường hợp số người đạt trên 50% tổng số đại diện hộ gia đình trong thôn, tổ dân phố đồng ý nhiều hơn số lượng hòa giải viên trong tổ hòa giải quy định tại\u0026nbsp;khoản 2 Điều 15 của Luật này\u0026nbsp;thì danh sách người được đề nghị công nhận là hòa giải viên được lập theo kết quả bầu từ cao xuống thấp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"71ee8b0e-06c1-4c6c-9959-07bc11d0baa0\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e4. Trường hợp số người được bầu không bảo đảm thành phần hoặc không đủ số lượng hòa giải viên trong tổ hòa giải quy định tại khoản 1 và khoản 2 Điều 15 của Luật này thì tổ chức bầu bổ sung.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"c6cbf422-9bc9-4b5c-99f0-ac0fcbd587ff\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e5. Trường hợp tất cả người trong danh sách bầu hòa giải viên không đáp ứng quy định tại điểm a khoản 3 Điều này thì tổ chức bầu lại.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"44f424c8-be2a-44f6-95f9-c568fe85a2fb\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e6. Chính phủ quy định chi tiết Điều này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"4d0e46e9-6f44-464a-ae11-15e595740919\" class=\"prov-article\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eĐiều 10. Chỉ định hòa giải viên\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"9c72bccc-c26a-4bbb-8a48-23d33433c678\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e1. Việc chỉ định hòa giải viên thuộc một trong các trường hợp sau đây:\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"2b3f9ea1-f4e9-4115-a3a5-4e495ba9b6a9\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003ea) Đã tổ chức bầu bổ sung nhưng số người được bầu không bảo đảm thành phần hoặc không đủ số lượng hòa giải viên trong tổ hòa giải quy định tại khoản 1 và khoản 2 Điều 15 của Luật này; \u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"79afd1b7-c0d4-43d8-a7ba-3f04116ab88d\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003eb) Đã tổ chức bầu lại nhưng số người được bầu không bảo đảm thành phần hoặc không đủ số lượng hòa giải viên trong tổ hòa giải quy định tại khoản 1 và khoản 2 Điều 15 của Luật này hoặc tất cả người trong danh sách bầu hòa giải viên không đáp ứng quy định tại điểm a khoản 3 Điều 9 của Luật này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"f9061954-e54b-40a4-b922-731a75ac25cb\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003ec) Không thể tổ chức bầu bằng các hình thức quy định tại khoản 2 Điều 9 của Luật này do sự kiện bất khả kháng theo quy định của pháp luật.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"dc2608d9-6191-4857-ac50-f7a80624b3cc\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e2. Người được chỉ định làm hòa giải viên phải có đủ tiêu chuẩn quy định tại Điều 8 của Luật này tự nguyện tham gia hòa giải ở cơ sở và không thuộc trường hợp đã được đưa ra bầu mà không đáp ứng quy định tại điểm a khoản 3 Điều 9 của Luật này. \u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"effaa7d5-ba31-445d-a5b1-721f98356478\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e3. Người thuộc trường hợp quy định tại khoản 2 Điều này có quyền ứng cử hoặc được giới thiệu vào danh sách đề nghị công nhận hòa giải viên. \u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"78463c83-4b82-4648-a74e-f200ea33d024\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e4. Trưởng ban công tác Mặt trận chủ trì, phối hợp với Trưởng thôn, Tổ trưởng tổ dân phố tổ chức lựa chọn người thuộc trường hợp quy định tại khoản 3 Điều này để giới thiệu vào danh sách đề nghị công nhận hòa giải viên. \u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"2b935dd4-7ba8-490c-b889-2e5c593ae4c7\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e5. Chính phủ quy định chi tiết Điều này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"497b5e45-03d5-45f0-a678-309946cb9a37\" class=\"prov-article\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eĐiều 11. Công nhận hòa giải viên\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"0cabfbb6-b44a-4b95-8621-991626128d73\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e1. Căn cứ kết quả bầu hòa giải viên quy định tại Điều 9 của Luật này và danh sách giới thiệu đề nghị công nhận hòa giải viên quy định tại khoản 4 Điều 10 của Luật này, Trưởng ban công tác Mặt trận lập danh sách người được đề nghị công nhận hòa giải viên để Chủ tịch Ủy ban nhân dân cấp xã quyết định công nhận hòa giải viên.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"d46b003b-5134-4023-be13-912e56259884\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e2. Quyết định công nhận hòa giải viên được gửi cho Ban thường trực Ủy ban Mặt trận Tổ quốc Việt Nam cấp xã, Trưởng ban công tác Mặt trận, Trưởng thôn, Tổ trưởng tổ dân phố, hòa giải viên và thông báo công khai ở thôn, tổ dân phố.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"d16304f5-b60d-420d-874c-b24aba70a486\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e3. Đối với hòa giải viên được công nhận thuộc trường hợp chỉ định quy định tại Điều 10 của Luật này, trong thời hạn 03 năm kể từ ngày ban hành quyết định công nhận, Trưởng ban công tác Mặt trận chủ trì tổ chức bầu hòa giải viên quy định tại Điều 9 của Luật này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"d88bba79-bde5-4a91-8303-bf5f89d2cb39\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e4. Chính phủ quy định chi tiết Điều này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"24a01cab-3b53-4fcb-9448-2c0e65fc8d12\" class=\"prov-article\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eĐiều 12. Quyền của hòa giải viên\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7294e338-4efa-4e89-a08d-30ed1d0b42bd\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e1. Thực hiện hoạt động hòa giải ở cơ sở.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"2c8c7b60-0256-44e8-998e-aed33ea5d5aa\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e2. Đề nghị các bên có liên quan cung cấp thông tin, tài liệu liên quan đến vụ, việc hòa giải.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"ba844ab4-0d0a-4d72-a920-e2677177a460\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e3. Tham gia sinh hoạt, thảo luận và quyết định nội dung, phương thức hoạt động của tổ hòa giải.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"34b944d1-eafe-4ce2-8c8e-b6544cb078fd\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e4. Được bồi dưỡng, tập huấn kiến thức pháp luật, nghiệp vụ và kỹ năng hòa giải; được cung cấp tài liệu liên quan đến hoạt động hòa giải.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"dbd31a33-4352-4a7d-9726-0ee8a1dba9d6\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e5. Hưởng thù lao theo vụ, việc khi thực hiện hòa giải.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"943991ee-d57f-4962-ad92-d7f7f68aa286\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e6. Được khen thưởng theo quy định của pháp luật về thi đua, khen thưởng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"342ef21c-b328-4389-967e-c5e98a74c10b\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e7. Được hỗ trợ, tạo điều kiện để khắc phục hậu quả nếu gặp tai nạn hoặc rủi ro ảnh hưởng đến sức khỏe, tính mạng trong khi thực hiện hoạt động hòa giải.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7d53671d-aac2-4907-81df-08cce7753c59\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e8. Mời người tham gia hòa giải quy định tại Điều 19 của Luật này. \u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7a739231-baa9-41cb-88fc-527c493be5fe\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e9. Được đề nghị Ủy ban nhân dân cấp xã, Công an cấp xã bảo đảm an ninh, trật tự khi tiến hành hòa giải trong trường hợp nhận thấy mâu thuẫn, tranh chấp, vi phạm pháp luật có thể dẫn đến hành vi bạo lực gây ảnh hưởng đến sức khỏe, tính mạng của hòa giải viên, các bên và những người khác tham gia hòa giải hoặc gây mất trật tự công cộng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"a57b19b3-5994-4be7-bc08-83d7983a7eff\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e10. Được hỗ trợ khi ứng dụng công nghệ thông tin, chuyển đổi số trong thực hiện các hoạt động hòa giải ở cơ sở bảo đảm phù hợp với điều kiện thực tiễn.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"c8af65d0-a8b4-49f9-8f76-f96b08dde2a2\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e11. Được kiến nghị, đề xuất cơ quan, tổ chức, cá nhân có thẩm quyền về các vấn đề liên quan đến hoạt động hòa giải.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"ba8102b2-afb3-4f5f-8420-2a3262fbaf51\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e12. Chính phủ quy định chi tiết khoản 5 và khoản 7 Điều này. \u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"cc9d30d8-602b-40f7-85e3-586e5d3d6103\" class=\"prov-article\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eĐiều 13. Nghĩa vụ của hòa giải viên\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"ca9cb960-efc1-43fb-8ca1-5f7fba1c37fe\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e1. Tiến hành hòa giải khi có căn cứ quy định tại Điều 23 của Luật này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"f5a39301-865a-4e28-a9b7-e1ebde66503d\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e2. Tuân thủ các nguyên tắc quy định tại Điều 4 của Luật này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"b14e9ae7-8d11-4af0-8ceb-e33091105ff2\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e3. Từ chối tiến hành hòa giải nếu có quyền lợi, nghĩa vụ liên quan đến vụ, việc hòa giải hoặc vì lý do khác dẫn đến không thể bảo đảm khách quan, công bằng trong hòa giải.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"1e2776fc-4361-4bfb-854a-b26e5b171f0e\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e4. Thông báo kịp thời cho Tổ trưởng tổ hòa giải trong trường hợp trực tiếp đề nghị Ủy ban nhân dân cấp xã, Công an cấp xã bảo đảm an ninh, trật tự quy định tại khoản 9 Điều 12 của Luật này; phối hợp thực hiện các biện pháp phòng ngừa trong trường hợp nhận thấy mâu thuẫn, tranh chấp có thể dẫn đến hành vi bạo lực gây ảnh hưởng đến sức khỏe, tính mạng của các bên và của những người khác tham gia hòa giải (nếu có) hoặc gây mất trật tự công cộng. \u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"c213f87e-89f1-4f3d-a484-16ae404ab24e\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 7.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e5. Thông báo kịp thời cho Tổ trưởng tổ hòa giải để báo cáo cơ quan có thẩm quyền xử lý trong trường hợp phát hiện mâu thuẫn, tranh chấp có dấu hiệu vi phạm pháp luật hành chính hoặc vi phạm pháp luật hình sự.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"b96f74e6-9c4d-425a-9ed0-73a7b45b7ffd\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 7.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e6. Đề xuất Ủy ban nhân dân cấp xã hỗ trợ bố trí người phiên dịch theo đề nghị của các bên.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"4247f641-cc02-4926-bf30-84f9c6b3c719\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 7.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e7. Lập văn bản về kết quả hòa giải sau khi kết thúc hòa giải quy định tại Điều 29 của Luật này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"5a7f38ab-927d-4d75-82e8-c7f4d5e40e4a\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 7.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e8. Tham gia bồi dưỡng, tập huấn kiến thức pháp luật, nghiệp vụ và kỹ năng hòa giải do cơ quan, tổ chức có thẩm quyền tổ chức.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"81933dcb-9ab0-4fbf-9593-c83e5fae9a75\" class=\"prov-article\" style=\"text-align: justify; margin: 6.0pt 0 7.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eĐiều 14. Thôi làm hòa giải viên, thôi làm Tổ trưởng tổ hòa giải\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"0d37b60b-7a9b-442b-8caf-1d1aa7947d6a\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 7.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e1. Việc thôi làm hòa giải viên được thực hiện khi thuộc một trong các trường hợp sau đây:\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"4fad8c7b-b4bf-4587-ba52-e4d63c096e21\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 7.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003ea) Theo nguyện vọng của hòa giải viên;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"571b8441-1c64-4d71-859c-25580f1bae4d\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 7.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003eb) Không còn đáp ứng một trong các tiêu chuẩn của hòa giải viên quy định tại Điều 8 của Luật này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"eab66d00-a18c-4299-94b9-974d0100e5cb\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 7.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003ec) Vi phạm nguyên tắc quy định tại Điều 4 của Luật này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"34063914-387e-4ae5-aca6-6cb7043b21cd\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 7.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e2. Việc thôi làm Tổ trưởng tổ hòa giải được thực hiện khi thuộc một trong các trường hợp sau đây:\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"77882f25-391f-4d3a-a8aa-f339c22f8002\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 7.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003ea) Theo nguyện vọng của Tổ trưởng tổ hòa giải;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"40033324-3c54-49ed-8649-d629517c3304\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 7.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003eb) Không hoàn thành nghĩa vụ của Tổ trưởng tổ hòa giải quy định tại Điều 18 của Luật này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"40c0ee42-a5ae-45ac-8372-7453a2d98cbf\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 7.0pt; line-height: 1.1;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e3. Trường hợp thôi làm hòa giải viên quy định tại khoản 1 Điều này thì Tổ trưởng tổ hòa giải đề nghị Trưởng ban công tác Mặt trận chủ trì, phối hợp với Trưởng thôn, Tổ trưởng tổ dân phố có văn bản đề nghị Chủ tịch Ủy ban nhân dân cấp xã quyết định thôi làm hòa giải viên.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"02a5bfd2-7c12-42bc-82a3-c3b468562dd0\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 7.0pt; line-height: 1.029;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e4. Trường hợp thôi làm hòa giải viên đối với Tổ trưởng tổ hòa giải quy định tại khoản 1 Điều này và thôi làm Tổ trưởng tổ hòa giải quy định tại khoản 2 Điều này thì Trưởng ban công tác Mặt trận chủ trì, phối hợp với Trưởng thôn, Tổ trưởng tổ dân phố có văn bản đề nghị Chủ tịch Ủy ban nhân dân cấp xã quyết định thôi làm hòa giải viên, thôi làm Tổ trưởng tổ hòa giải.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"d10aa215-d6ad-42e3-ac58-57a8eee27e77\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 7.0pt; line-height: 1.029;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e5. Quyết định thôi làm hòa giải viên, thôi làm Tổ trưởng tổ hòa giải được gửi Ban thường trực Ủy ban Mặt trận Tổ quốc Việt Nam cấp xã, Trưởng ban công tác Mặt trận, Trưởng thôn, Tổ trưởng tổ dân phố, hòa giải viên và thông báo công khai ở thôn, tổ dân phố.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"954f66ec-d031-4227-b471-dbab1d3b2fa5\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 7.0pt; line-height: 1.029;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e6. Chính phủ quy định chi tiết Điều này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"6343b5cc-a288-4f12-987a-aa42c2eb6769\" class=\"prov-section\" style=\"text-align: center; margin: 0pt 0 0pt; line-height: 1.029;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eMục 2\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-section\" style=\"text-align: center; margin: 0pt 0 0pt; line-height: 1.029;\" id=\"6343b5cc-a288-4f12-987a-aa42c2eb6769\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eTỔ HÒA GIẢI \u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"e74667af-e3fc-49a3-9ac6-12c9ca51fb9c\" class=\"prov-article\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eĐiều 15. Tổ chức của tổ hòa giải\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"9e0b3618-8d7a-4636-b96e-3816630907e5\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e1. Tổ hòa giải có Tổ trưởng và các hòa giải viên. Mỗi tổ hòa giải có từ 03 hòa giải viên trở lên, trong đó có hòa giải viên nữ. Đối với địa bàn có nhiều đồng bào dân tộc thiểu số, tổ hòa giải phải có hòa giải viên là người dân tộc thiểu số bảo đảm phù hợp với đặc điểm dân cư của địa phương. \u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"ef16891c-b3e1-474e-afcf-d4db43861c99\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e2. Chủ tịch Ủy ban nhân dân cấp xã quyết định số lượng tổ hòa giải trên địa bàn cấp xã, số lượng tổ hòa giải trong một thôn, tổ dân phố và số lượng hòa giải viên trong một tổ hòa giải căn cứ vào đặc điểm, tình hình kinh tế - xã hội, dân số của địa phương và đề nghị của Ban thường trực Ủy ban Mặt trận Tổ quốc Việt Nam cấp xã.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"5d40d803-5836-489f-b9f4-9b3ff8219817\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e3. Hằng năm, Trưởng ban công tác Mặt trận chủ trì, phối hợp với Tổ trưởng tổ hòa giải tiến hành rà soát, đánh giá về tổ chức, hoạt động của tổ hòa giải và kiến nghị Ban thường trực Ủy ban Mặt trận Tổ quốc Việt Nam cấp xã để đề nghị Chủ tịch Ủy ban nhân dân cấp xã kiện toàn tổ hòa giải.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"4289a5ea-d209-4f2e-b18b-6ab8367358db\" class=\"prov-article\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eĐiều 16. Trách nhiệm của tổ hòa giải\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"00238b20-5c13-4b33-87b2-9fdd35f5d4bd\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e1. Tổ chức thực hiện hòa giải.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"ee2588e2-4784-4888-ba6a-4fca75f92944\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e2. Tổ chức trao đổi kinh nghiệm, thảo luận các giải pháp để tiến hành hòa giải vụ, việc phức tạp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"3032ee22-8233-45b1-8b22-af4d7ccc097b\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e3. Phối hợp với Ban công tác Mặt trận, Chi hội Phụ nữ, Chi đoàn Thanh niên, Chi hội Cựu chiến binh, Chi hội Nông dân, Chi hội Người cao tuổi, Tổ bảo vệ an ninh, trật tự, các tổ hòa giải và tổ chức, cá nhân khác trong hoạt động hòa giải ở cơ sở.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"48e37d20-c594-4385-a08c-6ef02a9ea014\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e4. Kiến nghị với Ban thường trực Ủy ban Mặt trận Tổ quốc Việt Nam cấp xã, Ủy ban nhân dân cấp xã về hoạt động hòa giải ở cơ sở. \u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"064565b4-8862-45a7-be81-e2ee1ce23d0d\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e5. Đề nghị khen thưởng tổ hòa giải, hòa giải viên, người được mời tham gia hòa giải có thành tích xuất sắc trong công tác hòa giải ở cơ sở. \u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"3e34f8a0-d223-4a60-9ea2-0d25e9059fac\" class=\"prov-article\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eĐiều 17. Tổ trưởng tổ hòa giải \u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"586e44f3-5a64-4f79-9124-c12a6a85bf5c\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e1. Tổ trưởng tổ hòa giải do hòa giải viên bầu trong số các hòa giải viên để phụ trách tổ hòa giải. \u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8a03879c-43ad-40f3-bfd6-d3b38e0d4e3a\" class=\"prov-clause\" style=\"text-align: justify; margin: 5.0pt 0 5.0pt; line-height: 1.029;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e2. Việc bầu Tổ trưởng tổ hòa giải được thực hiện dưới sự chủ trì của Trưởng ban công tác Mặt trận bằng một hoặc kết hợp một số hình thức sau đây:\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"36dbdcda-8992-4ed7-a87f-b7ed742a0654\" class=\"prov-item\" style=\"text-align: justify; margin: 5.0pt 0 5.0pt; line-height: 1.029;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003ea) Biểu quyết công khai hoặc bỏ phiếu kín tại cuộc họp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"769b5245-8e7a-4a32-b1e4-e6d8d1cd65cc\" class=\"prov-item\" style=\"text-align: justify; margin: 5.0pt 0 5.0pt; line-height: 1.029;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003eb) Biểu quyết trực tuyến.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"d960fa6f-b0ba-49a1-b124-989cc1253dd0\" class=\"prov-clause\" style=\"text-align: justify; margin: 5.0pt 0 5.0pt; line-height: 1.029;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e3. Người được đề nghị công nhận là Tổ trưởng tổ hòa giải phải đạt trên 50% tổng số hòa giải viên của tổ hòa giải đồng ý và là người có số phiếu bầu cao nhất.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"667a72b5-b39b-49f1-903a-e6cb974337e2\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.029;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e4. Trưởng ban công tác Mặt trận có văn bản đề nghị công nhận Tổ trưởng tổ hòa giải để Chủ tịch Ủy ban nhân dân cấp xã quyết định công nhận. \u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"5c9d1cef-3cb3-4076-bab3-6dbe2257c7c4\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.029;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e5. Quyết định công nhận Tổ trưởng tổ hòa giải được gửi cho Ban thường trực Ủy ban Mặt trận Tổ quốc Việt Nam cấp xã, Trưởng ban công tác Mặt trận, Trưởng thôn, Tổ trưởng tổ dân phố, Tổ trưởng tổ hòa giải và thông báo công khai ở thôn, tổ dân phố.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7222cb18-a04a-4a1d-bbec-3b2a8b9b6840\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.029;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e6. Chính phủ quy định chi tiết Điều này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"3da66a2c-71c9-43e7-8c2a-bdecb50a7fb1\" class=\"prov-article\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.029;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eĐiều 18. Quyền và nghĩa vụ của Tổ trưởng tổ hòa giải \u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"b61f8dc6-ab91-46a1-b96d-bf74acf7859b\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.029;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e1. Phân công, phối hợp hoạt động của các hòa giải viên.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7055ca0f-99f9-4394-aea6-1f5f7146dca7\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.029;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e2. Đại diện cho tổ hòa giải trong quan hệ với Trưởng ban công tác Mặt trận, Trưởng thôn, Tổ trưởng tổ dân phố và cơ quan, tổ chức, cá nhân khác trong thực hiện trách nhiệm của tổ hòa giải.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"fd66b82c-5632-4b23-bc73-ea73777a8f69\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.029;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e3. Đề nghị cho thôi làm hòa giải viên quy định tại khoản 3 Điều 14 của Luật này. \u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"23d509f6-377c-402b-ab5b-af22be9d39c6\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.029;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e4. Báo cáo kịp thời với Chủ tịch Ủy ban nhân dân cấp xã và cơ quan có thẩm quyền về các vụ, việc quy định tại khoản 5 Điều 13 của Luật này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8ee48424-6607-48c9-ac23-761cab5e5f35\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.029;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e5. Báo cáo hằng năm, đột xuất về tổ chức và hoạt động của tổ hòa giải với Ủy ban nhân dân, Ban thường trực Ủy ban Mặt trận Tổ quốc Việt Nam cấp xã. \u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"56a64edf-dc15-4abe-82a4-954c0872ddf4\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.029;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e6. Phối hợp với Tổ trưởng tổ hòa giải khác để trao đổi kinh nghiệm hoặc tiến hành hòa giải những vụ, việc liên quan đến các thôn, tổ dân phố khác nhau. \u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"f5fd7a83-0131-4826-b13a-e0fe6fc8d0f4\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.029;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e7. Thực hiện thủ tục đề nghị thanh toán thù lao theo vụ, việc hòa giải cho hòa giải viên trong tổ hòa giải và cho người được mời tham gia hòa giải quy định tại điểm b khoản 2 Điều 19 của Luật này, kinh phí hoạt động của tổ hòa giải theo quy định của pháp luật.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"73b84f6b-9fc3-4af1-89a8-fddac85dfd48\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.029;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e8. Có các quyền, nghĩa vụ của hòa giải viên quy định tại Điều 12 và Điều 13 của Luật này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"e97d9b0a-50c5-4e07-acec-914a2c7d6470\" class=\"prov-section\" style=\"text-align: center; margin: 5.0pt 0 5.0pt; line-height: 1.029;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eMục 3\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-section\" style=\"text-align: center; margin: 5.0pt 0 5.0pt; line-height: 1.029;\" id=\"e97d9b0a-50c5-4e07-acec-914a2c7d6470\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eNGƯỜI ĐƯỢC MỜI THAM GIA HÒA GIẢI \u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"ccf455cb-2001-4478-9b82-5b21f1f54c73\" class=\"prov-article\" style=\"text-align: justify; margin: 5.0pt 0 5.0pt; line-height: 1.029;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eĐiều 19. Người được mời tham gia hòa giải \u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"ed144d25-2388-46b0-883d-730a7f9a3bb8\" class=\"prov-clause\" style=\"text-align: justify; margin: 7.0pt 0 7.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e1. Những người được mời tham gia hòa giải bao gồm già làng, trưởng bản, chức sắc, chức việc tôn giáo; người có uy tín trong dòng họ, ở nơi sinh sống, nơi làm việc; người biết rõ vụ, việc; người có trình độ pháp lý, có kinh nghiệm, kiến thức chuyên môn, kiến thức xã hội, đại diện của cơ quan, tổ chức có liên quan đến vụ, việc. \u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"b559ebab-d699-4289-a7fa-543b3f709468\" class=\"prov-clause\" style=\"text-align: justify; margin: 7.0pt 0 7.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e2. Hình thức tham gia hòa giải của người được mời bao gồm: \u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"c27af446-4816-47f4-99b1-2911136498a7\" class=\"prov-item\" style=\"text-align: justify; margin: 7.0pt 0 7.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003ea) Tư vấn, hỗ trợ kiến thức, phương thức, kỹ năng hòa giải cho hòa giải viên;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"0aedf453-5fea-403d-8063-b128bc81dd43\" class=\"prov-item\" style=\"text-align: justify; margin: 7.0pt 0 7.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003eb) Trực tiếp tham gia hòa giải vụ, việc cùng với hòa giải viên.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8c875ff8-07e1-4d2e-875a-8316b83a4862\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e3. Việc mời người tham gia hòa giải được thực hiện như sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"527b66d8-7e59-4b90-89b9-1db3f8eefc29\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003ea) Hòa giải viên mời người tham gia hòa giải đối với trường hợp quy định tại điểm a khoản 2 Điều này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"51593f99-b1c2-4b4e-9bb9-6c4f00f5cb82\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003eb) Hòa giải viên mời người tham gia hòa giải khi có sự đồng ý của các bên hoặc các bên thống nhất mời đối với trường hợp quy định tại điểm b khoản 2 Điều này. Người được mời tham gia hòa giải không thay thế tư cách chủ trì của hòa giải viên trong quá trình hòa giải vụ, việc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"1ae11143-2991-4b97-85a2-99c1dd570cd9\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e4. Cơ quan, tổ chức quản lý người được mời tham gia hòa giải có trách nhiệm tạo điều kiện để người được mời tham gia hoạt động hòa giải theo quy định của pháp luật.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"068cbdf8-be75-4a4e-a871-b3f28b3e0f52\" class=\"prov-article\" style=\"text-align: justify; margin: 6.0pt 0 7.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eĐiều 20. Quyền của người được mời tham gia hòa giải\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"65b6cd8a-6756-442a-9b47-8c7c19ee3aae\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 7.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e1. Người được mời tham gia hòa giải quy định tại điểm a khoản 2 Điều 19 của Luật này có các quyền quy định tại khoản 6, khoản 11 Điều 12 của Luật này và các quyền sau đây:\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"6663ea97-f37b-4bc2-8069-c3fa865931fd\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 7.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003ea) Đề nghị hòa giải viên cung cấp thông tin, tài liệu liên quan đến vụ, việc hòa giải; \u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"cb4d86ee-98d6-4b52-a8e6-4b3ea03f8cc1\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 7.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003eb) Được cơ quan, tổ chức quản lý người được mời tạo điều kiện tham gia hòa giải;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"004157da-cba9-4bd9-8e41-5cea4cab36e7\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 7.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003ec) Tham gia thảo luận về giải pháp và nội dung hòa giải;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"a2b6412e-cd2b-4549-87b1-38db17385327\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 7.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003ed) Được hỗ trợ tài liệu, phổ biến pháp luật phục vụ hoạt động hòa giải.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7e2b29d4-ffad-43bb-a000-184a8e33bbd0\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 7.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e2. Người được mời tham gia hòa giải quy định tại điểm b khoản 2 Điều 19 của Luật này có các quyền quy định tại khoản 1 Điều này và các quyền sau đây:\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"339e8dcd-f4aa-4c31-b85b-5a604c1981a9\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 7.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003ea) Được hưởng thù lao theo vụ, việc khi thực hiện hòa giải;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"106bd570-6160-4dd4-af81-81a4901d6bda\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 7.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003eb) Được hỗ trợ, tạo điều kiện để khắc phục hậu quả nếu gặp tai nạn hoặc rủi ro ảnh hưởng đến sức khỏe, tính mạng trong khi thực hiện hoạt động hòa giải.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"e8f9c9f9-aeab-4a0d-893e-39a3a4686cb7\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 7.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e3. Chính phủ quy định chi tiết điểm a và điểm b khoản 2 Điều này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"89402ab0-b2d6-491d-823b-1d77c0f57365\" class=\"prov-article\" style=\"text-align: justify; margin: 6.0pt 0 7.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eĐiều 21. Nghĩa vụ của người được mời tham gia hòa giải\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"49618cb5-7114-4c4e-bb74-1c746b7157fd\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 7.0pt; line-height: 1.05;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e1. Tuân thủ các nguyên tắc quy định tại Điều 4 của Luật này. \u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b5acd8a-3727-4d14-9e9a-97c2223b9648\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 7.0pt; line-height: 1.079;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e2. Từ chối tham gia hòa giải nếu có quyền lợi, nghĩa vụ liên quan đến vụ, việc hòa giải hoặc vì lý do khác dẫn đến không thể bảo đảm khách quan, công bằng trong hòa giải.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"fcb6a57e-3a47-4527-8a77-e35a9de2985b\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 7.0pt; line-height: 1.079;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e3. Phối hợp với hòa giải viên trực tiếp tiến hành hòa giải thực hiện các biện pháp phòng ngừa trong trường hợp nhận thấy mâu thuẫn, tranh chấp có thể dẫn đến hành vi bạo lực gây ảnh hưởng đến sức khỏe, tính mạng của hòa giải viên, của các bên và của những người khác tham gia hòa giải (nếu có) hoặc gây mất trật tự công cộng. \u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"e05c6fbf-ca12-450d-bb5f-d0aca4f50998\" class=\"prov-section\" style=\"text-align: center; margin: 6.0pt 0 6.0pt; line-height: 1.079;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eMục 4\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-section\" style=\"text-align: center; margin: 6.0pt 0 6.0pt; line-height: 1.079;\" id=\"e05c6fbf-ca12-450d-bb5f-d0aca4f50998\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eCÁC BÊN TRONG HÒA GIẢI \u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"6babc7e9-b100-4114-be5c-75680bd2c080\" class=\"prov-article\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.079;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eĐiều 22. Quyền và nghĩa vụ của các bên trong hòa giải\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"0e748554-2f84-4dd2-80bd-e93f1c32616f\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.079;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e1. Các bên trong hòa giải có các quyền sau đây:\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"cd9c6731-b955-4871-9535-6822af18f250\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.079;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003ea) Lựa chọn, đề xuất hoặc đề nghị thay đổi hòa giải viên, người được mời tham gia hòa giải, người phiên dịch; lựa chọn, đề xuất hình thức, địa điểm, thời gian để tiến hành hòa giải; \u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"90d353c5-cb58-401f-b250-6805ab0a2244\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.079;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003eb) Đồng ý hoặc từ chối hòa giải; yêu cầu tạm dừng hoặc chấm dứt hòa giải;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"48972858-3777-4b7a-97a3-069243653d8b\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.079;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003ec) Yêu cầu việc hòa giải được tiến hành công khai hoặc không công khai;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"50f74aac-fdb7-4f9a-9964-34b99732f357\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.079;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003ed) Được bày tỏ ý chí và quyết định về nội dung hòa giải;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"aa5c1ca8-5aa3-4b78-aa2b-a4502e7d3fb1\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.079;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003eđ) Đề nghị hòa giải viên đề xuất Ủy ban nhân dân cấp xã hỗ trợ bố trí người phiên dịch trong trường hợp các bên không thể tự bố trí người phiên dịch;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b5a5d61-2ca1-43b1-b10f-e4b3ea4c6340\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.079;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003ee) Yêu cầu hòa giải viên lập văn bản về kết quả hòa giải sau khi kết thúc hòa giải;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"23259204-7354-4aaf-8933-6f1979342515\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.079;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003eg) Yêu cầu Tòa án nhân dân có thẩm quyền công nhận kết quả hòa giải thành theo quy định của pháp luật về tố tụng dân sự.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"e5889140-153f-4608-8714-15219f285c02\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.079;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e2. Các bên trong hòa giải có các nghĩa vụ sau đây:\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"1ef1fcfe-d4da-4af6-940f-e1639b63c714\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.079;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003ea) Trình bày đúng sự thật các tình tiết của vụ, việc; cung cấp thông tin, tài liệu có liên quan;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"37768b30-0055-4474-aeb4-1e49f38ccec7\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.079;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003eb) Tôn trọng hòa giải viên, người được mời tham gia hòa giải và quyền của các bên có liên quan;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"fe2c3723-f7a9-4428-b4d6-c7c912cf7ce8\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.079;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003ec) Không gây ảnh hưởng đến an ninh, trật tự trong quá trình hòa giải;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"acaa18c1-1c5f-48a8-b0a7-2117d5443010\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.079;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003ed) Ký tên hoặc điểm chỉ hoặc xác nhận trong trường hợp đồng ý với các nội dung của văn bản về kết quả hòa giải quy định tại khoản 2 Điều 29 của Luật này; \u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"0c6b7dd2-512f-4e49-bf12-d60b48195d36\" class=\"prov-item\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.079;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003eđ) Thực hiện thỏa thuận hòa giải thành quy định tại khoản 1 Điều 30 của Luật này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"46ac0ede-572d-4227-b1c7-c37e027ed8af\" class=\"prov-chapter\" style=\"text-align: center; margin: 6.0pt 0 6.0pt; line-height: 1.079;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eChương III\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-chapter\" style=\"text-align: center; margin: 6.0pt 0 6.0pt; line-height: 1.079;\" id=\"46ac0ede-572d-4227-b1c7-c37e027ed8af\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eHOẠT ĐỘNG HÒA GIẢI Ở CƠ SỞ\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"1be793e2-edac-4f24-b2f6-be2ad41d9ed7\" class=\"prov-article\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.079;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eĐiều 23. Căn cứ tiến hành hòa giải\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.079;\" id=\"1be793e2-edac-4f24-b2f6-be2ad41d9ed7\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003eVụ, việc thuộc phạm vi hòa giải ở cơ sở được hòa giải viên tiến hành hòa giải khi có sự đồng ý của các bên và thuộc một trong các căn cứ sau đây:\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"16c8c77d-6fea-424d-ab78-e34c9c6b4a8b\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.079;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e1. Một bên hoặc các bên yêu cầu hòa giải.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"a484eecb-31bb-468a-a4f2-bb6a5f041bb7\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.079;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e2. Hòa giải viên chủ động đề xuất hòa giải khi chứng kiến hoặc biết vụ, việc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"49bcf839-97a5-4369-9d19-e18b195e2499\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.079;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e3. Theo đề nghị của cơ quan, tổ chức, cá nhân có liên quan.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"3b23ba4d-9efd-46c3-905d-372d9899d71e\" class=\"prov-article\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.079;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eĐiều 24. Phân công hòa giải viên \u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"bd8593c6-fd1c-40e7-8ba2-e8c5cec70dad\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.079;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e1. Trong thời hạn 02 ngày, kể từ ngày phát sinh một trong các căn cứ tiến hành hòa giải quy định tại Điều 23 của Luật này, Tổ trưởng tổ hòa giải phân công hòa giải viên tiến hành hòa giải trong trường hợp các bên không lựa chọn hòa giải viên.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"16cb7790-2d00-4c7d-afb2-dc70b67570a0\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.079;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e2. Tổ trưởng tổ hòa giải không phân công hòa giải viên tiến hành hòa giải nếu có căn cứ cho rằng hòa giải viên có quyền lợi, nghĩa vụ liên quan đến vụ, việc hòa giải hoặc có lý do khác dẫn đến không thể bảo đảm khách quan, công bằng trong hòa giải.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"408a589d-6008-40ba-abdf-c3526c13d6db\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.079;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e3. Tổ trưởng tổ hòa giải phân công hòa giải viên khác thực hiện việc hòa giải khi thuộc một trong các trường hợp thôi làm hòa giải viên quy định tại khoản 1 Điều 14 của Luật này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"1f61227b-f458-4565-919b-3cba6265996d\" class=\"prov-article\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.079;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e\u003cstrong\u003eĐiều 25. Địa điểm, thời gian hòa giải\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"03a4a1a2-98f8-40d6-9089-ae69cc6183bd\" class=\"prov-clause\" style=\"text-align: justify; margin: 6.0pt 0 6.0pt; line-height: 1.079;\"\u003e\u003cspan style=\"font-size: 14.0pt;\"\u003e1. Địa điểm hòa giải là nơi xảy ra vụ, việc hoặc nơi do các bên hoặc hòa giải viên lựa chọn, bảo đảm thuận lợi cho các bên. \u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"84739086
