Cơ quan Công báo Việt Nam\"},\"feedbackSuggestions\":{\"title\":\"PHẢN ÁNH, KIẾN NGHỊ VĂN BẢN QPPL\",\"description\":\"PHẢN ÁNH, KIẾN NGHỊ VĂN BẢN QPPL\"}}},\"footer\":{\"unit\":\"Đơn vị chủ quản\",\"unitContent\":\"Bộ Tư pháp\",\"address\":\"Địa chỉ\",\"addressContent\":\"Số 60 Trần Phú - Ba Đình - Thành phố Hà Nội\",\"phoneNumber\":\"Điện thoại\",\"phoneNumberContent\":\"024.6273.9468\",\"fax\":\"Fax\",\"faxContent\":\"024.6273.9359\"},\"underConstruction\":{\"title\":\"Đang cập nhật\",\"message\":\"Chức năng này đang được phát triển.\"},\"gioiThieu\":{\"timeline\":{\"2005\":{\"description\":\"Năm 2005 đánh dấu sự khởi đầu của dự án xây dựng Cơ sở dữ liệu quốc gia về pháp luật, với mục tiêu số hóa và tập trung hóa các văn bản pháp luật của Việt Nam.\"},\"2012-2013\":{\"description\":\"Giai đoạn 2012-2013 là thời kỳ phát triển và mở rộng hệ thống, với việc tích hợp thêm nhiều tính năng và cải thiện giao diện người dùng.\"},\"2023-2025\":{\"description\":\"Giai đoạn 2023-2025 tập trung vào việc nâng cấp và hiện đại hóa hệ thống, áp dụng các công nghệ mới và mở rộng phạm vi phục vụ.\"}},\"overview\":{\"title\":\"SƠ LƯỢC MÔ HÌNH CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"CSDLQG về pháp luật tập hợp các văn bản quy phạm pháp luật và văn bản hợp nhất văn bản quy phạm pháp luật (sau đây gọi chung là văn bản) dưới dạng văn bản điện tử do Chính phủ thống nhất quản lý, có địa chỉ truy cập vbpl.vn, bao gồm các Cơ sở dữ liệu thành phần: Cơ sở dữ liệu văn bản pháp luật Trung ương và Cơ sở dữ liệu văn bản pháp luật địa phương.\",\"central\":{\"title\":\"Cơ sở dữ liệu Văn bản pháp luật Trung ương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của các Bộ, cơ quan ngang Bộ, cơ quan nhà nước khác ở Trung ương ban hành hoặc phối hợp ban hành. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật; Văn bản hợp nhất; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"local\":{\"title\":\"Cơ sở dữ liệu văn bản pháp luật địa phương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của từng tỉnh, thành phố trực thuộc Trung ương trên toàn quốc. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật của Hội đồng nhân dân và Ủy ban nhân dân; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"other\":{\"title\":\"Các chuyên mục khác\",\"content\":\"Ngoài các Cơ sở dữ liệu thành phần kể trên, CSDLQG về pháp luật còn có các chuyên mục khác như: Giới thiệu văn bản mới, Tin tức, Tình huống pháp luật. Ngoài ra, CSDLQG về thủ tục hành chính, bộ pháp điển điện tử, cổng thông tin điện tử Bộ Tư pháp cũng trích xuất về CSDLQG về pháp luật.\"}},\"vision\":{\"title\":\"Tầm nhìn\",\"content\":\"Trở thành nguồn tra cứu văn bản pháp luật chính thống, đầy đủ và đáng tin cậy, phục vụ hiệu quả cho người dân, doanh nghiệp và cơ quan nhà nước.\"},\"mission\":{\"title\":\"Sứ mệnh\",\"content\":\"Cung cấp hệ thống văn bản pháp luật được cập nhật kịp thời, tra cứu thuận tiện, góp phần nâng cao nhận thức pháp luật và bảo đảm việc tuân thủ pháp luật trong xã hội.\"},\"features\":{\"title\":\"MỘT SỐ TÍNH NĂNG, TIỆN ÍCH CỦA CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"Hiện nay, CSDLQG về PL có giao diện tương đối thân thiện, dễ tìm kiếm, dễ khai thác các thông tin và tải về sử dụng. Cơ sở dữ liệu cung cấp các chức năng, tiện ích cơ bản và thuận tiện\",\"list\":[{\"key\":\"fullText\",\"label\":\"Tra cứu toàn văn\",\"icon\":\"SearchOutlined\"},{\"key\":\"tableOfContents\",\"label\":\"Tự động tạo mục lục\",\"icon\":\"BookOutlined\"},{\"key\":\"relatedDocuments\",\"label\":\"Liên kết văn bản liên quan\",\"icon\":\"LinkOutlined\"},{\"key\":\"validity\",\"label\":\"Xác định hiệu lực tự động\",\"icon\":\"BarChartOutlined\"},{\"key\":\"validityHistory\",\"label\":\"Lịch sử hiệu lực\",\"icon\":\"ClockCircleOutlined\"},{\"key\":\"download\",\"label\":\"Tải văn bản\",\"icon\":\"DownloadOutlined\"},{\"key\":\"english\",\"label\":\"Xem văn bản tiếng Anh\",\"icon\":\"GlobalOutlined\"},{\"key\":\"centralLocal\",\"label\":\"Liên kết văn bản Trung ương – địa ph 17 tháng 6 năm 2003;\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cem\u003eTheo đề nghị của Bộ trưởng Bộ Quốc phòng,\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eNGHỊ ĐỊNH:\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6c6a-e172-11f0-ae2c-558e8a27b0cd\" class=\"prov-chapter\" style=\"font-family: 'Times New Roman', Times, serif;\" align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eChương I \u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6c6a-e172-11f0-ae2c-558e8a27b0cd\" class=\"prov-chapter\" style=\"font-family: 'Times New Roman', Times, serif;\" align=\"center\" data-merged=\"true\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eQUY ĐỊNH CHUNG\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6c74-e172-11f0-9c1a-c5a83c4fa598\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 1. \u003c/strong\u003ePhạm vi điều chỉnh\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNghị định này quy định chi tiết một số điều của Luật Biên giới quốc gia về xây dựng, quản lý, bảo vệ biên giới quốc gia, khu vực biên giới; bảo đảm ngân sách cho xây dựng, quản lý, bảo vệ biên giới, khu vực biên giới và trách nhiệm quản lý nhà nước về biên giới quốc gia của nước Cộng hoà xã hội chủ nghĩa Việt Nam.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6c7e-e172-11f0-9f44-9988130bd365\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 2. \u003c/strong\u003eĐối tượng chấp hành pháp luật về biên giới\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCơ quan, tổ chức, cá nhân Việt Nam và nước ngoài sinh sống, hoạt động có liên quan đến biên giới quốc gia và khu vực biên giới có trách nhiệm chấp hành các quy định của Luật Biên giới quốc gia, Nghị định này và các quy định khác của pháp luật Việt Nam; trong trường hợp Điều ước quốc tế mà Việt Nam ký kết hoặc gia nhập có quy định khác thì áp dụng Điều ước quốc tế đó.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6c88-e172-11f0-b123-1d1bca8d2aea\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 3. \u003c/strong\u003eBiên giới quốc gia\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6c92-e172-11f0-bd7b-5bdaa988aa03\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Biên giới quốc gia của nước Cộng hoà xã hội chủ nghĩa Việt Nam là đường và mặt thẳng đứng theo đường đó để xác định giới hạn lãnh thổ đất liền, các đảo, các quần đảo trong đó có quần đảo Hoàng Sa và quần đảo Trường Sa, vùng biển, lòng đất, vùng trời của nước Cộng hoà xã hội chủ nghĩa Việt Nam.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6c9c-e172-11f0-9846-8fff84d738b1\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Đường quy định ở khoản 1 Điều này gồm biên giới quốc gia trên đất liền và biên giới quốc gia trên biển.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6ca6-e172-11f0-b1da-9d7873f4ab93\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3. Mặt thẳng đứng quy định ở khoản 1 Điều này gồm mặt thẳng đứng theo biên giới quốc gia trên đất liền, biên giới quốc gia trên biển xuống lòng đất và lên vùng trời.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6cb0-e172-11f0-9923-a953cd13b220\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 4. \u003c/strong\u003eBiên giới quốc gia trên đất liền\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBiên giới quốc gia trên đất liền giữa nước Cộng hoà xã hội chủ nghĩa Việt Nam với các nước láng giềng được xác định bằng hệ thống mốc quốc giới, Hiệp ước về hoạch định biên giới giữa Việt Nam với các nước láng giềng cùng các bản đồ, Nghị định thư kèm theo các Hiệp ước đó.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6cba-e172-11f0-ab70-770f8be29047\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 5. \u003c/strong\u003eBiên giới quốc gia trên biển\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6cc4-e172-11f0-a0a8-53b759547f18\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Biên giới quốc gia trên biển là ranh giới phía ngoài lãnh hải của đất liền, lãnh hải của đảo, lãnh hải của các quần đảo Việt Nam. Ở những nơi lãnh hải, nội thuỷ hoặc vùng nước lịch sử của Việt Nam tiếp giáp với lãnh hải, nội thuỷ hoặc vùng nước lịch sử của nước láng giềng, biên giới quốc gia trên biển được xác định theo Điều ước quốc tế mà Việt Nam ký kết với các nước láng giềng đó.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6cce-e172-11f0-9534-a3e91684862e\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Biên giới quốc gia trên biển được xác định và đánh dấu bằng các toạ độ trên hải đồ theo quy định của pháp luật Việt Nam và Điều ước quốc tế mà Việt Nam ký kết hoặc gia nhập.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6cd8-e172-11f0-8fc0-895375fbb592\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 6.\u003c/strong\u003e Lãnh hải\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6ce2-e172-11f0-9fe0-33c77ebf3db2\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Lãnh hải Việt Nam là vùng biển rộng 12 hải lý tính từ đường cơ sở ra phía ngoài; trong trường hợp Điều ước quốc tế mà Việt Nam ký với các nước láng giềng có quy định khác thì áp dụng Điều ước quốc tế đó. Lãnh hải Việt Nam gồm:\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6cec-e172-11f0-a323-bd61cbb26804\" class=\"prov-item\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea) Lãnh hải của đất liền;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6cf6-e172-11f0-ae4f-eb2cf7d2bdbb\" class=\"prov-item\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb) Lãnh hải của các đảo, lãnh hải của các quần đảo Việt Nam.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6d00-e172-11f0-ab59-af130da2d265\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Nước Cộng hoà xã hội chủ nghĩa Việt Nam thực hiện chủ quyền đầy đủ và toàn vẹn đối với lãnh hải của mình cũng như đối với vùng trời, đáy biển và lòng đất dưới đáy biển của lãnh hải.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6d0a-e172-11f0-96a1-19419b7d72f6\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3. Tàu thuyền nước ngoài đi qua không gây hại trong lãnh hải Việt Nam, không được làm phương hại đến hoà bình, an ninh, trật tự, môi trường sinh thái của nước Cộng hoà xã hội chủ nghĩa Việt Nam theo quy định của pháp luật Việt Nam và Điều ước quốc tế mà Việt Nam ký kết hoặc gia nhập.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6d14-e172-11f0-8155-75464f31f772\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 7. \u003c/strong\u003eĐường ranh giới phía ngoài vùng tiếp giáp lãnh hải, vùng đặc quyền về kinh tế, thềm lục địa\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6d1e-e172-11f0-8a48-d1c9104234a1\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Đường ranh giới phía ngoài vùng tiếp giáp lãnh hải là đường mà mỗi điểm cách đều điểm gần nhất của đường cơ sở dùng để tính chiều rộng lãnh hải là 24 hải lý.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6d28-e172-11f0-9529-c790e64be2e4\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Đường ranh giới phía ngoài vùng đặc quyền về kinh tế là đường mà mỗi điểm cách đều điểm gần nhất của đường cơ sở dùng để tính chiều rộng lãnh hải là 200 hải lý.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6d32-e172-11f0-81db-89a74914c2ea\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3. Đường ranh giới phía ngoài thềm lục địa là bờ ngoài của rìa lục địa. Nơi nào bờ ngoài của rìa lục địa cách đường cơ sở dùng để tính chiều rộng lãnh hải chưa đến 200 hải lý thì ranh giới phía ngoài của thềm lục địa nơi đó mở rộng ra 200 hải lý.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6d3c-e172-11f0-8119-81bd990e74b1\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e4. Ở những nơi vùng tiếp giáp lãnh hải, vùng đặc quyền về kinh tế, thềm lục địa Việt Nam có liên quan với vùng tiếp giáp lãnh hải, vùng đặc quyền về kinh tế, thềm lục địa của nước láng giềng, đường ranh giới phía ngoài của các vùng đó được xác định theo Điều ước quốc tế ký kết giữa Việt Nam và nước láng giềng đó.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6d46-e172-11f0-9b55-1330a6be1e1e\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e5. Đường ranh giới phía ngoài của vùng tiếp giáp lãnh hải, vùng đặc quyền về kinh tế, thềm lục địa được xác định, đánh dấu bằng các toạ độ trên hải đồ theo quy định của pháp luật Việt Nam và Điều ước quốc tế mà Việt Nam ký kết hoặc gia nhập.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6d50-e172-11f0-80ec-3f73f38b3536\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\" type=\"13:9176cdfd-6e47-4247-92e1-4203f8133e86\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 8. \u003c/strong\u003eKhu vực biên giới\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6d5a-e172-11f0-8eb6-c356f4d9a745\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\" type=\"10:f3628256-7e2f-4516-820c-e893bfcf662b\" parent-id=\"8b2a6d50-e172-11f0-80ec-3f73f38b3536\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Phạm vi khu vực biên giới trên đất liền tính từ biên giới quốc gia trên đất liền vào hết địa giới hành chính của xã, phường, thị trấn có một phần địa giới hành chính trùng hợp với biên giới quốc gia trên đất liền.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6d64-e172-11f0-8f3c-bbab50dd0a7c\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\" type=\"10:f3628256-7e2f-4516-820c-e893bfcf662b\" parent-id=\"8b2a6d50-e172-11f0-80ec-3f73f38b3536\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Phạm vi khu vực biên giới trên biển tính từ biên giới quốc gia trên biển vào hết địa giới hành chính của xã, phường, thị trấn giáp biển và đảo, quần đảo.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6d6e-e172-11f0-b73a-9defc1e1569d\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\" type=\"10:f3628256-7e2f-4516-820c-e893bfcf662b\" parent-id=\"8b2a6d50-e172-11f0-80ec-3f73f38b3536\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3. Danh sách các xã, phường, thị trấn ở khu vực biên giới trên đất liền, khu vực biên giới trên biển được quy định tại các Nghị định của Chính phủ ban hành Quy chế khu vực biên giới; trường hợp có sự thay đổi về địa giới hành chính của các xã, phường, thị trấn ở khu vực biên giới thì sửa đổi, bổ sung cho phù hợp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6d78-e172-11f0-8362-b7e3cbcc1db2\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\" parent-id=\"8b2a6d50-e172-11f0-80ec-3f73f38b3536\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e4. Mọi hoạt động của người, phương tiện; việc quản lý, bảo vệ, giữ gìn an ninh, trật tự an toàn xã hội ở khu vực biên giới thực hiện theo Nghị định về quy chế khu vực biên giới và các văn bản quy phạm pháp luật khác có liên quan.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6d82-e172-11f0-a59f-dd15948c7dc2\" class=\"prov-chapter\" style=\"font-family: 'Times New Roman', Times, serif;\" align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eChương II \u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6d82-e172-11f0-a59f-dd15948c7dc2\" class=\"prov-chapter\" style=\"font-family: 'Times New Roman', Times, serif;\" align=\"center\" data-merged=\"true\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eXÂY DỰNG, QUẢN LÝ, BẢO VỆ BIÊN GIỚI QUỐC GIA VÀ KHU VỰC BIÊN GIỚI\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6d8c-e172-11f0-a641-6996c6500e22\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 9. \u003c/strong\u003eXây dựng công trình biên giới\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6d96-e172-11f0-ac9e-9d1d16dad613\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Công trình biên giới được ưu tiên đầu tư xây dựng theo kế hoạch, bao gồm công trình để cố định đường biên giới và công trình phục vụ hoạt động quản lý, bảo vệ biên giới quốc gia.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6da0-e172-11f0-b0d2-73f0e91f2cb1\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Công trình để cố định đường biên giới quốc gia do các Bộ, ngành, Uỷ ban nhân dân tỉnh, thành phố trực thuộc Trung ương lập kế hoạch trình Chính phủ quyết định.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6daa-e172-11f0-a3c0-cb8850558c75\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3. Công trình phục vụ hoạt động quản lý, bảo vệ biên giới quốc gia do Bộ Quốc phòng xây dựng kế hoạch trình Chính phủ quyết định.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6db4-e172-11f0-8a0c-737b8664ae0e\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 10. \u003c/strong\u003eMốc quốc giới\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6dbe-e172-11f0-8da5-69ca4f17c952\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Mốc quốc giới được cắm theo quy định của pháp luật Việt Nam và Điều ước quốc tế về biên giới đã được ký kết với nước láng giềng để đánh dấu đường biên giới quốc gia trên thực địa và được giữ gìn, bảo vệ giữ đúng vị trí, hình dáng, kích thước, ký hiệu, chữ và màu sắc đã được quy định.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6dc8-e172-11f0-b064-a9f054b1b7ad\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Khi phát hiện hoặc nhận được tin báo mốc quốc giới bị hư hại, bị mất, bị sai lệch vị trí, đồn biên phòng gần nhất phải tiến hành các thủ tục cần thiết để có biện pháp kịp thời xử lý đồng thời thông báo ngay cho cơ quan, đơn vị bảo vệ biên giới nước láng giềng để giải quyết theo thẩm quyền do Hiệp định về biên giới đã ký kết quy định.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6dd2-e172-11f0-930a-0f84280e27ac\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3. Việc cắm lại, khôi phục, sửa chữa, bảo dưỡng mốc quốc giới thực hiện theo quy định của pháp luật Việt Nam và Điều ước quốc tế đã ký kết với nước láng giềng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6ddc-e172-11f0-9ff6-e359ac2fa8db\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 11. \u003c/strong\u003eĐầu tư phát triển kinh tế - xã hội ở khu vực biên giới\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6de6-e172-11f0-936c-21108ed5431e\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Việc đầu tư xây dựng, phát triển kinh tế - xã hội ở khu vực biên giới được thực hiện theo chủ trương, chiến lược và quy hoạch, kế hoạch phát triển kinh tế - xã hội của Nhà nước trong từng giai đoạn để nâng cao đời sống vật chất, tinh thần của nhân dân và gắn với tăng cường quốc phòng, an ninh.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6df0-e172-11f0-86e2-99e2dc642010\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Hàng năm các Bộ, cơ quan ngang Bộ, cơ quan thuộc Chính phủ có liên quan và Uỷ ban nhân dân tỉnh, thành phố trực thuộc Trung ương có biên giới quốc gia trong phạm vi chức năng, nhiệm vụ, quyền hạn của mình lập kế hoạch đầu tư xây dựng thực hiện chiến lược phát triển kinh tế - xã hội, tăng cường quốc phòng, an ninh ở khu vực biên giới trình Chính phủ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6dfa-e172-11f0-a2c7-114e9686abf8\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 12. \u003c/strong\u003eXây dựng hệ thống chính trị cơ sở ở khu vực biên giới\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6e04-e172-11f0-b6d9-67a86489f2f0\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Hệ thống chính trị cơ sở ở khu vực biên giới phải thường xuyên được củng cố, xây dựng vững mạnh theo chủ trương, chính sách của Đảng, Nhà nước; bảo đảm thực hiện tốt các chức năng lãnh đạo, quản lý, xây dựng khu vực biên giới và quản lý, bảo vệ biên giới quốc gia.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6e0e-e172-11f0-b043-611798eddcb0\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Đội ngũ cán bộ cơ sở ở khu vực biên giới được tuyển chọn, bồi dưỡng đào tạo nâng cao trình độ lãnh đạo, quản lý phù hợp với yêu cầu phát triển kinh tế, xã hội, đảm bảo quốc phòng, an ninh; ưu tiên đào tạo, bồi dưỡng cán bộ là dân tộc ít người và cán bộ ở miền xuôi lên công tác lâu dài ở khu vực biên giới.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6e18-e172-11f0-9033-f5f1a01f04f5\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\" type=\"1:2d4e9cd0-6379-41e7-9238-73e55d80d129\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3. Bộ Nội vụ, Uỷ ban Dân tộc trong phạm vi chức năng, nhiệm vụ, quyền hạn của mình chủ trì, phối hợp với Bộ Quốc phòng, các Bộ, ngành liên quan nghiên cứu, đề xuất kế hoạch xây dựng hệ thống chính trị cơ sở, đào tạo bồi dưỡng đội ngũ cán bộ ở từng khu vực biên giới trình Thủ tướng Chính phủ quyết định.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6e22-e172-11f0-bcba-4932021d957a\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 13. \u003c/strong\u003eBố trí dân cư ở khu vực biên giới\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6e2c-e172-11f0-9d6f-1be6e3a9899a\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Bố trí dân cư ở khu vực biên giới được quy hoạch phù hợp với quy hoạch tổng thể về phát triển kinh tế - xã hội, điều kiện tự nhiên, tính chất và đặc điểm từng vùng, từng dân tộc, từng địa phương; huy động, sử dụng lao động hợp lý để tạo ra của cải vật chất, hàng hoá phục vụ tiêu dùng, xuất khẩu và đáp ứng yêu cầu xây dựng, quản lý, bảo vệ biên giới quốc gia, khu vực biên giới.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6e36-e172-11f0-91b6-4b865117158e\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Nhà nước có chính sách phù hợp để nhân dân định cư ổn định ở khu vực biên giới; khuyến khích những cán bộ công tác lâu dài, người tình nguyện đến định cư ở khu vực biên giới, đặc biệt là nơi khó khăn.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6e40-e172-11f0-ada1-e7c85bba6ffe\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\" type=\"10:fbf4daa8-205d-43a2-aadd-d8d472cc9f2c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3. Bộ Nông nghiệp và Phát triển nông thôn chủ trì, phối hợp với các Bộ, ngành liên quan và Uỷ ban nhân dân tỉnh, thành phố trực thuộc Trung ương có biên giới quốc gia nghiên cứu xây dựng quy hoạch, bố trí dân cư ở khu vực biên giới trình Thủ tướng Chính phủ quyết định.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6e4a-e172-11f0-ae54-296829acfe4e\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 14. \u003c/strong\u003eNgày Biên phòng toàn dân\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6e54-e172-11f0-be0b-138fda4d3a56\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Ngày 03 tháng 3 là Ngày Biên phòng toàn dân được tổ chức thực hiện hàng năm trong phạm vi cả nước. Nội dung hoạt động gồm:\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6e5e-e172-11f0-abed-f3e743ca5771\" class=\"prov-item\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea) Giáo dục ý thức pháp luật về biên giới quốc gia, tôn trọng biên giới, chủ quyền lãnh thổ, tinh thần trách nhiệm của các cấp, các ngành, của cán bộ, nhân viên cơ quan, tổ chức, cán bộ, chiến sĩ lực lượng vũ trang và của toàn dân; đặc biệt là cán bộ, nhân viên cơ quan, tổ chức, cán bộ, chiến sĩ lực lượng vũ trang, chính quyền và nhân dân khu vực biên giới trong xây dựng, quản lý, bảo vệ biên giới quốc gia, khu vực biên giới.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6e68-e172-11f0-a8c5-cdc48ef8ee39\" class=\"prov-item\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb) Huy động các ngành, các địa phương hướng về biên giới, tích cực tham gia xây dựng tiềm lực về mọi mặt ở khu vực biên giới, tạo ra sức mạnh của toàn dân, giúp đỡ Bộ đội biên phòng và các đơn vị khác thuộc lực lượng vũ trang nhân dân, các cơ quan chức năng ở khu vực biên giới trong xây dựng, quản lý, bảo vệ biên giới quốc gia, giữ gìn an ninh, trật tự, an toàn xã hội ở khu vực biên giới.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6e72-e172-11f0-923a-4fa8d5608ea5\" class=\"prov-item\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ec) Xây dựng biên giới hoà bình, hữu nghị, ổn định lâu dài với các nước láng giềng, phối hợp hai bên biên giới trong quản lý, bảo vệ biên giới quốc gia và phòng, chống tội phạm.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6e7c-e172-11f0-bdeb-7d1bd4a97a04\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Người đứng đầu các cấp, các ngành, các địa phương có trách nhiệm tổ chức thực hiện Ngày Biên phòng toàn dân theo chỉ đạo của Chính phủ và hướng dẫn của Bộ Quốc phòng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6e86-e172-11f0-827d-bbe43d6bfc31\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3. Bộ Tư lệnh Bộ đội biên phòng có trách nhiệm tham mưu cho Bộ Quốc phòng chỉ đạo, hướng dẫn các cấp, các ngành, các địa phương tổ chức thực hiện Ngày Biên phòng toàn dân.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6e90-e172-11f0-92cb-fbdb26869143\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 15. \u003c/strong\u003eXây dựng nền biên phòng toàn dân, thế trận biên phòng toàn dân\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6e9a-e172-11f0-83d6-6143dc055cd9\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Nền biên phòng toàn dân, thế trận biên phòng toàn dân được xây dựng vững mạnh trên cơ sở xây dựng hệ thống chính trị; xây dựng, phát triển kinh tế - xã hội; tăng cường, củng cố quốc phòng, an ninh ở khu vực biên giới; tạo thế trận phòng thủ bảo vệ Tổ quốc, quản lý, bảo vệ biên giới quốc gia, giữ gìn an ninh, trật tự, an toàn xã hội ở khu vực biên giới.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6ea4-e172-11f0-81eb-cbc972b6845d\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Nền biên phòng toàn dân, thế trận biên phòng toàn dân được kết hợp xây dựng trong nền quốc phòng toàn dân, thế trận quốc phòng toàn dân và thế trận an ninh nhân dân.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6eae-e172-11f0-92a7-9566d665d68d\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3. Người đứng đầu các cấp, các ngành, các địa phương có trách nhiệm tổ chức xây dựng nền biên phòng toàn dân, thế trận biên phòng toàn dân theo hướng dẫn của Bộ Quốc phòng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6eb8-e172-11f0-9e13-5f1ca5e32289\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e4. Bộ Tư lệnh Bộ đội biên phòng có trách nhiệm tham mưu cho Bộ Quốc phòng, hướng dẫn các cấp, các ngành, các địa phương tổ chức thực hiện.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6ec2-e172-11f0-9bff-a98cae5e8864\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 16. \u003c/strong\u003eXây dựng lực lượng nòng cốt, chuyên trách quản lý, bảo vệ biên giới quốc gia\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6ecc-e172-11f0-b8e7-817793bef035\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Bộ đội biên phòng được xây dựng theo hướng cách mạng, chính quy, tinh nhuệ, từng bước hiện đại, vững mạnh về chính trị, giỏi về chuyên môn nghiệp vụ, nắm vững pháp luật và công tác đối ngoại nhằm đáp ứng yêu cầu quản lý, bảo vệ biên giới quốc gia trong mọi tình huống.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6ed6-e172-11f0-a64f-85039fff7d8f\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Bộ Quốc phòng giúp Chính phủ thực hiện quản lý nhà nước về xây dựng và hoạt động của Bộ đội biên phòng. Bộ Tư lệnh Bộ đội biên phòng trực tiếp quản lý, chỉ huy, xây dựng Bộ đội biên phòng để thực hiện chức năng, nhiệm vụ quản lý, bảo vệ biên giới quốc gia, giữ gìn an ninh, trật tự, an toàn xã hội ở khu vực biên giới theo quy định của pháp luật.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6ee0-e172-11f0-8e83-05f7132ce2c0\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 17. \u003c/strong\u003eQuản lý, bảo vệ biên giới quốc gia và khu vực biên giới\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6eea-e172-11f0-96b7-0917e7d9b7a6\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Quản lý, bảo vệ biên giới quốc gia và khu vực biên giới nhằm bảo đảm sự bất khả xâm phạm biên giới quốc gia, giữ vững chủ quyền, toàn vẹn lãnh thổ, giữ gìn an ninh, trật tự, an toàn xã hội khu vực biên giới; xây dựng biên giới hoà bình, hữu nghị, ổn định lâu dài với các nước láng giềng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6ef4-e172-11f0-8859-9d7bccb72538\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Biên giới quốc gia, mốc quốc giới, khu vực biên giới được quản lý, bảo vệ theo quy định của Luật Biên giới quốc gia, Nghị định này, các nghị định về quy chế khu vực biên giới, quy chế cửa khẩu, Hiệp định về quy chế biên giới quốc gia, các văn bản quy phạm pháp luật khác và Điều ước quốc tế có liên quan mà Việt Nam ký kết hoặc gia nhập.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6efe-e172-11f0-ab9c-fbfa75051c76\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 18. \u003c/strong\u003eGiải quyết các vấn đề về biên giới\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6f08-e172-11f0-983b-67c507f23ce5\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Việc giải quyết vấn đề về biên giới, lãnh thổ liên quan đến nước láng giềng thông qua đàm phán theo quy định của pháp luật và chỉ đạo của Chính phủ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6f12-e172-11f0-a653-c335ed97278a\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Nghiêm cấm việc tự ý thoả thuận sửa đổi đường biên giới quốc gia hoặc làm thay đổi đường biên giới quốc gia.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6f1c-e172-11f0-9b07-ff4b1a0f9358\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 19. \u003c/strong\u003eTrách nhiệm quản lý, bảo vệ biên giới quốc gia và khu vực biên giới\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6f26-e172-11f0-95c3-c563ffb7c0ad\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Quản lý, bảo vệ biên giới quốc gia là trách nhiệm của Nhà nước, của các cơ quan, tổ chức, lực lượng vũ trang, chính quyền các cấp và của toàn dân, trực tiếp và thường xuyên là chính quyền, nhân dân khu vực biên giới.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6f30-e172-11f0-b8ca-fd2415cdb16c\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Cơ quan, tổ chức, cá nhân có nghĩa vụ, trách nhiệm tôn trọng đường biên giới quốc gia, nghiêm chỉnh chấp hành và thực hiện pháp luật về biên giới quốc gia; tích cực tham gia bảo vệ biên giới quốc gia, giữ gìn an ninh, trật tự, an toàn xã hội ở khu vực biên giới; phối hợp, giúp đỡ Bộ đội biên phòng đấu tranh phòng ngừa và chống các hành vi xâm phạm chủ quyền, lãnh thổ, biên giới quốc gia, an ninh, trật tự, an toàn xã hội ở khu vực biên giới.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6f3a-e172-11f0-becb-b742bc3e9efb\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3. Trong khi thực hiện nhiệm vụ bảo vệ biên giới quốc gia, các đơn vị thuộc lực lượng vũ trang nhân dân phải căn cứ vào chức năng, nhiệm vụ, quyền hạn theo quy định của Luật Biên giới quốc gia và các quy định của pháp luật về biên giới quốc gia.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6f44-e172-11f0-990c-a3c382ee38cf\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e4. Bộ đội biên phòng là lực lượng nòng cốt, chuyên trách, chủ trì, phối hợp với lực lượng Công an nhân dân, các ngành hữu quan, các địa phương trong hoạt động quản lý, bảo vệ biên giới quốc gia, giữ gìn an ninh, trật tự, an toàn xã hội ở khu vực biên giới.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6f4e-e172-11f0-9bc6-c358e567592b\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e5. Bộ đội hải quân, lực lượng Cảnh sát biển chịu trách nhiệm phối hợp với Bộ đội biên phòng quản lý, bảo vệ biên giới quốc gia trên biển.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6f58-e172-11f0-87c3-29d9c7e6ee2b\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e6. Bộ đội phòng không - không quân có trách nhiệm quản lý, bảo vệ biên giới quốc gia trên không và phối hợp với Bộ đội biên phòng bảo vệ biên giới quốc gia trên biển.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6f62-e172-11f0-9058-bbb672196810\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e7. Các đơn vị thuộc lực lượng vũ trang nhân dân làm nhiệm vụ ở khu vực biên giới có trách nhiệm phối hợp với Bộ đội biên phòng, Bộ đội phòng không - không quân bảo vệ biên giới quốc gia. Bộ Quốc phòng quy định phạm vi trách nhiệm cụ thể và quy chế phối hợp giữa các lực lượng thuộc quyền trong quản lý, bảo vệ biên giới quốc gia.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6f6c-e172-11f0-8cf8-afcb1f094938\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 20. \u003c/strong\u003eCửa khẩu và hoạt động tại cửa khẩu\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6f76-e172-11f0-bdf6-b3bff2cdd291\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Việc mở cửa khẩu và nơi mở ra cho qua lại biên giới, nâng cấp cửa khẩu, đóng cửa khẩu; xác định, công bố các tuyến đường bộ, đường sắt, đường thuỷ nội địa, đường hàng hải, đường hàng không cho việc quá cảnh thực hiện theo quy định của pháp luật Việt Nam và Điều ước quốc tế đã được ký kết với nước láng giềng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6f80-e172-11f0-a9e4-af0197849133\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Hoạt động nhập cảnh, xuất cảnh, nhập khẩu, xuất khẩu, quá cảnh và qua lại biên giới quốc gia của cư dân trong khu vực biên giới tại cửa khẩu thực hiện theo quy chế cửa khẩu do Chính phủ quy định và pháp luật có liên quan.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6f8a-e172-11f0-b360-8d1616457ea5\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 21. \u003c/strong\u003eKiểm soát và bảo đảm an ninh, trật tự tại cửa khẩu\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6f94-e172-11f0-92f2-07ccaf130236\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Tại các cửa khẩu biên giới đường bộ, cửa khẩu đường sắt, cửa khẩu đường thuỷ nội địa, cửa khẩu đường hàng hải (cảng biển), cửa khẩu đường hàng không, các cơ quan chức năng thực hiện việc kiểm soát nhập cảnh, xuất cảnh, nhập khẩu, xuất khẩu, quá cảnh và qua lại biên giới theo quy định của pháp luật.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6f9e-e172-11f0-ae2e-edd8b96f7fa4\" class=\"prov-item\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea) Tại cửa khẩu biên giới đường bộ, cửa khẩu đường sắt, cửa khẩu đường thuỷ nội địa trong khu vực biên giới, cửa khẩu đường hàng hải (cảng biển), Bộ đội biên phòng chủ trì phối hợp với các lực lượng liên quan để quản lý, bảo vệ an ninh, trật tự, an toàn xã hội trong khu vực cửa khẩu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6fa8-e172-11f0-8495-fdbfaa5f5239\" class=\"prov-item\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb) Tại cửa khẩu đường hàng không, cơ quan an ninh của Bộ Công an chủ trì, phối hợp với các cơ quan liên quan để quản lý, bảo vệ an ninh, trật tự, an toàn xã hội trong khu vực cửa khẩu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6fb2-e172-11f0-a035-df61aa0e6fb4\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Các cơ quan chức năng quản lý nhà nước tại cửa khẩu thực hiện nhiệm vụ, quyền hạn theo quy định của pháp luật.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6fbc-e172-11f0-a98c-435e42045d3a\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 22. \u003c/strong\u003eChế độ, chính sách bảo đảm xây dựng, quản lý, bảo vệ biên giới quốc gia, khu vực biên giới\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6fc6-e172-11f0-9fa6-1f68f20877eb\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Chế độ, chính sách bảo đảm xây dựng, quản lý, bảo vệ biên giới quốc gia, khu vực biên giới bao gồm:\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6fd0-e172-11f0-8dc1-adcef6854fbf\" class=\"prov-item\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea) Chế độ, chính sách đối với người trực tiếp, người tham gia xây dựng, quản lý bảo vệ biên giới quốc gia;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6fda-e172-11f0-a899-af8eab957432\" class=\"prov-item\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb) Chế độ, chính sách xã hội đối với đồng bào dân tộc ở khu vực biên giới;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6fe4-e172-11f0-8eef-db84adfdf212\" class=\"prov-item\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ec) Chế độ, chính sách ưu tiên đầu tư xây dựng phát triển kinh tế - xã hội ở khu vực biên giới;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6fee-e172-11f0-a66a-7dcd7e9ca389\" class=\"prov-item\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ed) Chế độ, chính sách đảm bảo cho quốc phòng, an ninh ở khu vực biên giới.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a6ff8-e172-11f0-9723-3f3dc36819df\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Các Bộ, ngành trong phạm vi chức năng, nhiệm vụ, quyền hạn của mình có trách nhiệm bổ sung hoàn thiện chế độ, chính sách quy định tại khoản 1 Điều này trình cấp có thẩm quyền quyết định.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a7002-e172-11f0-b0f2-e76489afbb41\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 23. \u003c/strong\u003eNguồn tài chính bảo đảm cho việc xây dựng, quản lý, bảo vệ biên giới quốc gia và khu vực biên giới\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a700c-e172-11f0-861f-c3981ebc9dd0\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Nguồn tài chính bảo đảm cho xây dựng, quản lý, bảo vệ biên giới, khu vực biên giới bao gồm ngân sách nhà nước (ngân sách trung ương và ngân sách địa phương) và các nguồn thu khác theo quy định của pháp luật.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a7016-e172-11f0-ad4d-bd7d6201e6fa\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Ngân sách nhà nước bảo đảm cho việc xây dựng, quản lý, bảo vệ biên giới và khu vực biên giới bao gồm:\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a7020-e172-11f0-81b6-b9ebe1b134aa\" class=\"prov-item\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea) Xây dựng, phát triển kinh tế, văn hoá - xã hội ở khu vực biên giới;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a702a-e172-11f0-807d-c1cd9275af85\" class=\"prov-item\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb) Xây dựng công trình biên giới;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a7034-e172-11f0-a420-25ff0163cf78\" class=\"prov-item\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ec) Hoạt động quản lý, bảo vệ biên giới, giữ gìn an ninh, trật tự, an toàn xã hội khu vực biên giới;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a703e-e172-11f0-8cac-89e9f1722d9d\" class=\"prov-item\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ed) Thực hiện chế độ, chính sách đối với người trực tiếp và người tham gia xây dựng, quản lý, bảo vệ biên giới.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a7048-e172-11f0-ba3d-c915334d10a8\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 24. \u003c/strong\u003ePhân cấp nhiệm vụ chi ngân sách về xây dựng, quản lý, bảo vệ biên giới quốc gia, khu vực biên giới\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a7052-e172-11f0-af6b-4b9bb611f66c\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Ngân sách trung ương bảo đảm cho các nhiệm vụ xây dựng, quản lý, bảo vệ biên giới quốc gia và khu vực biên giới do các cơ quan, đơn vị Trung ương thực hiện.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a705c-e172-11f0-a726-6d9d51c64142\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Ngân sách địa phương bảo đảm cho các nhiệm vụ xây dựng, quản lý, bảo vệ biên giới quốc gia và khu vực biên giới do các địa phương thực hiện.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a7066-e172-11f0-866d-3937471ba214\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 25. \u003c/strong\u003eLập dự toán và quyết toán ngân sách xây dựng, quản lý, bảo vệ biên giới quốc gia, khu vực biên giới\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eViệc lập dự toán, chấp hành và quyết toán chi ngân sách cho xây dựng, quản lý, bảo vệ biên giới quốc gia và khu vực biên giới thực hiện theo quy định của Luật Ngân sách Nhà nước.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a7070-e172-11f0-8536-5fc95f2976d4\" class=\"prov-chapter\" style=\"font-family: 'Times New Roman', Times, serif;\" align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eChương III \u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a7070-e172-11f0-8536-5fc95f2976d4\" class=\"prov-chapter\" style=\"font-family: 'Times New Roman', Times, serif;\" align=\"center\" data-merged=\"true\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eQUẢN LÝ NHÀ NƯỚC VỀ BIÊN GIỚI QUỐC GIA\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a707a-e172-11f0-96a0-a12018b630d4\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 26. \u003c/strong\u003eTrách nhiệm của Bộ Quốc phòng\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a7084-e172-11f0-908e-afcb70e8143a\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\" type=\"10:06efd20b-fa69-4949-9613-ff71e3bcc085\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Chủ trì, phối hợp với Bộ Ngoại giao, Bộ Công an hướng dẫn, chỉ đạo Uỷ ban nhân dân các tỉnh, thành phố trực thuộc Trung ương thực hiện quản lý nhà nước về biên giới quốc gia;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a708e-e172-11f0-bcbb-bd38963cdbfc\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Phối hợp với Bộ Ngoại giao thực hiện nhiệm vụ đàm phán giải quyết các vấn đề về biên giới lãnh thổ;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a7098-e172-11f0-a5e8-8f8cb77d594f\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3. Chủ trì, phối hợp với các Bộ, ngành có liên quan nghiên cứu, đề xuất xây dựng và chỉ đạo thực hiện chiến lược, chính sách về biên giới;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a70a2-e172-11f0-a749-2571343427aa\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e4. Chủ trì, phối hợp với Bộ Công an thực hiện nhiệm vụ quản lý, bảo vệ biên giới quốc gia, giữ gìn an ninh, trật tự, an toàn xã hội ở khu vực biên giới;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a70ac-e172-11f0-aa04-fb7c536913b9\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e5. Chủ trì, phối hợp với các Bộ, ngành có liên quan tổ chức soạn thảo văn bản quy phạm pháp luật về biên giới, chính sách đối với lực lượng quản lý, bảo vệ biên giới trình cấp có thẩm quyền quyết định và ban hành văn bản hướng dẫn thực hiện;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a70b6-e172-11f0-93b4-5bed6d2312ad\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e6. Xây dựng Bộ đội biên phòng vững mạnh, đảm bảo chỉ huy tập trung, thống nhất; đào tạo, bồi dưỡng nâng cao trình độ nghiệp vụ, quân sự, pháp luật, đối ngoại để thực hiện vai trò nòng cốt, chuyên trách quản lý, bảo vệ biên giới quốc gia, giữ gìn an ninh, trật tự, an toàn xã hội ở khu vực biên giới;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a70c0-e172-11f0-9736-f9036a09cfb2\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\" type=\"10:414c1fab-7907-4dba-bafb-083bd3a6911e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e7. Nghiên cứu, ứng dụng khoa học và công nghệ phục vụ quản lý, bảo vệ biên giới quốc gia; đề xuất Chính phủ chỉ đạo xây dựng các công trình để cố định biên giới quốc gia, công trình phục vụ hoạt động quản lý, bảo vệ biên giới quốc gia; đầu tư kinh phí, trang bị phương tiện kỹ thuật cho các lực lượng quản lý, bảo vệ biên giới quốc gia;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a70ca-e172-11f0-bb60-91091ca0ee1c\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e8. Tổ chức sơ kết, tổng kết công tác quản lý, bảo vệ biên giới quốc gia, giữ gìn an ninh, trật tự, an toàn xã hội ở khu vực biên giới và thực hiện chế độ báo cáo Chính phủ và thông báo cho các Bộ, ngành liên quan;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a70d4-e172-11f0-8730-5be80765034e\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e9. Chủ trì, phối hợp với các Bộ, ngành, địa phương tuyên truyền, phổ biến, giáo dục pháp luật về biên giới quốc gia; tổ chức kiểm tra, thanh tra; giải quyết khiếu nại, tố cáo và xử lý vi phạm pháp luật về quản lý, bảo vệ biên giới quốc gia;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a70de-e172-11f0-a757-cf3dd1015bb3\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e10. Hợp tác quốc tế về công tác biên phòng và tiến hành công tác đối ngoại biên phòng để phối hợp quản lý, bảo vệ biên giới quốc gia, xây dựng biên giới hoà bình, hữu nghị với các nước láng giềng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a70e8-e172-11f0-84ad-455a2f32be59\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 27. \u003c/strong\u003eTrách nhiệm của Bộ Ngoại giao\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a70f2-e172-11f0-bcc5-95064ccf6b2d\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Chủ trì, phối hợp với các Bộ, ngành đề xuất chủ trương, chính sách về biên giới lãnh thổ và quản lý nhà nước về biên giới quốc gia;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a70fc-e172-11f0-842e-0fb83c998598\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Chủ trì, phối hợp với Bộ Quốc phòng và các Bộ, ngành liên quan giúp Chính phủ xác định biên giới quốc gia, phạm vi chủ quyền, quyền chủ quyền của nước Cộng hoà xã hội chủ nghĩa Việt Nam trên đất liền, trên biển, trên không, các hải đảo, thềm lục địa và tổ chức đàm phán về xác định biên giới, phân giới cắm mốc và xử lý những vấn đề liên quan với các nước láng giềng;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a7106-e172-11f0-bc05-5f6063ac7193\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\" type=\"10:51362411-bf2f-46f2-ad2c-b7e14a31661c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3. Phối hợp với Bộ Quốc phòng chỉ đạo, hướng dẫn Uỷ ban nhân dân các tỉnh, thành phố trực thuộc Trung ương có biên giới quốc gia thực hiện chức năng quản lý nhà nước về biên giới quốc gia;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"ebd437a0-bd6b-11f1-96bb-7d22c840b6da\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif;\"\u003e4. Chủ trì, phối hợp với Bộ Quốc phòng trình \u003c/span\u003eThủ tướng Chính phủ chỉ đạo hoặc hướng dẫn xử lý theo thẩm quyền các vấn đề phát sinh trong hoạt động của các ngành, các địa phương liên quan đến chủ quyền, quyền chủ quyền của nước Cộng hoà xã hội chủ nghĩa Việt Nam trên đất liền, trên biển, trên không, các hải đảo và thềm lục địa;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a711a-e172-11f0-9670-6b2b6d795afb\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e5. Phối hợp với Bộ Quốc phòng đào tạo, bồi dưỡng, hướng dẫn Bộ đội biên phòng về pháp luật, Điều ước quốc tế về quản lý, bảo vệ biên giới quốc gia, nghiệp vụ đối ngoại và giải quyết vụ việc liên quan đến biên giới và người nước ngoài.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a7124-e172-11f0-a498-276652c403a5\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 28. \u003c/strong\u003eTrách nhiệm của Bộ Công an\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a712e-e172-11f0-928d-cf1f063c9a42\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Phối hợp với Bộ Quốc phòng chỉ đạo, hướng dẫn Bộ đội biên phòng thực hiện nhiệm vụ bảo đảm an ninh, trật tự, an toàn xã hội, đấu tranh phòng, chống tội phạm và các hành vi vi phạm pháp luật khác ở khu vực biên giới;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a7138-e172-11f0-afc8-afc708deb37f\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Chủ trì, phối hợp với Bộ Quốc phòng, Bộ Ngoại giao và các Bộ, ngành liên quan xây dựng quy chế phối hợp giữa các lực lượng để thực hiện nhiệm vụ quản lý, kiểm soát nhập cảnh, xuất cảnh, nhập khẩu, xuất khẩu và quá cảnh theo quy định của pháp luật;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a7142-e172-11f0-b2bf-af2600f42842\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3. Phối hợp với Bộ Quốc phòng đào tạo, bồi dưỡng nâng cao trình độ nghiệp vụ công tác bảo vệ an ninh, trật tự, an toàn xã hội cho lực lượng chuyên trách quản lý, bảo vệ biên giới quốc gia;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a714c-e172-11f0-8874-fd58c99c2ff7\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e4. Phối hợp với Bộ Quốc phòng trong việc trao đổi tình hình; thống nhất chủ trương chỉ đạo đấu tranh phòng, chống tội phạm và các hành vi vi phạm pháp luật khác về an ninh, trật tự, an toàn xã hội ở khu vực biên giới;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a7156-e172-11f0-b817-894f4289372c\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e5. Hợp tác quốc tế trong lĩnh vực an ninh quốc gia, phối hợp với Bộ Quốc phòng thực hiện hợp tác an ninh biên giới.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a7160-e172-11f0-8b9e-af6f4ad42a8c\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\" type=\"10:484ecc2a-c523-4eed-b589-69fd1a168ab2\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 29. \u003c/strong\u003eTrách nhiệm của các Bộ, cơ quan ngang Bộ, cơ quan thuộc Chính phủ\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTrong phạm vi nhiệm vụ, quyền hạn của mình các Bộ, cơ quan ngang Bộ, cơ quan thuộc Chính phủ có trách nhiệm thực hiện và phối hợp với Bộ Quốc phòng, Bộ Ngoại giao, Bộ Công an trong công tác quản lý nhà nước về biên giới quốc gia theo quy định của pháp luật.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a716a-e172-11f0-904c-bf02e0edfd8a\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 30. \u003c/strong\u003eTrách nhiệm của Bộ đội biên phòng\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a7174-e172-11f0-bf63-43dd90067a01\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Bộ Tư lệnh Bộ đội biên phòng có trách nhiệm làm tham mưu cho Bộ Quốc phòng về công tác quản lý, bảo vệ biên giới quốc gia, giữ gìn an ninh, trật tự, an toàn xã hội ở khu vực biên giới và xây dựng lực lượng Bộ đội biên phòng;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a717e-e172-11f0-a6a1-17086c8efcc4\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Những vấn đề liên quan đến xây dựng, quản lý, bảo vệ biên giới quốc gia, khu vực biên giới và giữ gìn an ninh, trật tự, an toàn xã hội ở khu vực biên giới, cửa khẩu, Bộ Tư lệnh Bộ đội biên phòng được chủ động báo cáo, quan hệ trực tiếp với các cơ quan chức năng của Đảng, Nhà nước, các Bộ, các ngành liên quan, Uỷ ban nhân dân tỉnh, thành phố trực thuộc Trung ương, lực lượng bảo vệ biên giới, chính quyền nước tiếp giáp để trao đổi giải quyết đồng thời báo cáo Bộ Quốc phòng;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a7188-e172-11f0-8eb8-3579f26cbfc0\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3. Bộ đội biên phòng hoạt động theo quy định của pháp luật và Điều ước quốc tế mà Việt Nam ký kết hoặc gia nhập có liên quan đến biên giới quốc gia, an ninh, trật tự, an toàn xã hội ở khu vực biên giới và tại các cửa khẩu;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a7192-e172-11f0-8ef1-c9388b7d2209\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e4. Bộ đội biên phòng được bố trí lực lượng, phương tiện phù hợp để thực hiện chức năng, nhiệm vụ quản lý, bảo vệ biên giới quốc gia, giữ gìn an ninh, trật tự an toàn xã hội ở khu vực biên giới và tại các cửa khẩu; kiểm tra, kiểm soát qua lại biên giới, ra vào khu vực biên giới, vành đai biên giới; kiểm soát nhập cảnh, xuất cảnh tại các cửa khẩu (trừ cửa khẩu hàng không do Bộ Công an quản lý); đấu tranh phòng chống tội phạm, chống buôn lậu, gian lận thương mại và thực hiện công tác đối ngoại biên phòng, sẵn sàng chiến đấu chống xung đột vũ trang và chiến tranh xâm lược theo quy định của pháp luật;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a719c-e172-11f0-b24e-cf7b94378d9a\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e5. Chủ trì, phối hợp với các lực lượng vũ trang, các ngành liên quan làm tham mưu cho Bộ Quốc phòng chỉ đạo tổ chức xây dựng nền biên phòng toàn dân, thế trận biên phòng toàn dân.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a71a6-e172-11f0-bf2c-fb353743c824\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 31. \u003c/strong\u003eTrách nhiệm của Uỷ ban nhân dân các cấp nơi có biên giới quốc gia\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a71b0-e172-11f0-85e2-03b2b7b87c8f\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Thực hiện quản lý nhà nước về biên giới quốc gia tại địa phương mình theo quy định của pháp luật và chỉ đạo, hướng dẫn của Bộ Quốc phòng và các Bộ, ngành có liên quan;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a71ba-e172-11f0-8006-6367d5bddab3\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Xây dựng khu vực biên giới vững mạnh về chính trị, kinh tế văn hoá - xã hội, quốc phòng, an ninh; xây dựng nền biên phòng toàn dân, thế trận biên phòng toàn dân vững mạnh trong thế trận quốc phòng toàn dân và thế trận an ninh nhân dân tại địa phương;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a71c4-e172-11f0-9b1b-c946b53e29c2\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3. Xây dựng quy hoạch, bố trí dân cư, xây dựng cơ sở hạ tầng, sắp xếp lại sản xuất ở khu vực biên giới; kết hợp phát triển kinh tế văn hoá - xã hội với củng cố, tăng cường quốc phòng, an ninh ở khu vực biên giới;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a71ce-e172-11f0-837d-ed4fda57c275\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e4. Chỉ đạo các lực lượng, các ban, ngành và phát động phong trào quần chúng nhân dân ở địa phương phối hợp với Bộ đội biên phòng để quản lý, bảo vệ biên giới quốc gia; giữ gìn an ninh, trật tự, an toàn xã hội và đấu tranh phòng, chống tội phạm trong khu vực biên giới theo quy định của pháp luật;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a71d8-e172-11f0-b7c5-ffdc775d4ced\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e5. Phối hợp với các Bộ, ngành liên quan:\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a71e2-e172-11f0-ae58-331eb6975da5\" class=\"prov-item\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea) Xây dựng và thực hiện các dự án phát triển kinh tế, văn hoá - xã hội đối với từng tiểu vùng, tạo sự thay đổi bộ mặt kinh tế, xã hội ở khu vực biên giới;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a71ec-e172-11f0-be31-610573736fd6\" class=\"prov-item\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb) Động viên các doanh nghiệp hoạt động ở khu vực biên giới hỗ trợ việc xây dựng các cơ sở hạ tầng, phát triển giáo dục, y tế, văn hoá, xã hội;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a71f6-e172-11f0-b4d3-f1febb0d8661\" class=\"prov-item\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ec) Vận động, khuyến khích các tổ chức, địa phương cả nước kết nghĩa, liên doanh và hỗ trợ các địa phương ở khu vực biên giới.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a7200-e172-11f0-8778-254349a57b43\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e6. Tổ chức tuyên truyền, phổ biến, giáo dục pháp luật về biên giới quốc gia;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a720a-e172-11f0-9fb3-b9dcccd0181e\" class=\"prov-clause\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e7. Thực hiện quan hệ đối ngoại với chính quyền địa phương nước láng giềng theo quy định của pháp luật và điều ước quốc tế về biên giới.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a7214-e172-11f0-a8c5-f5d5152301ab\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 32. \u003c/strong\u003eTrách nhiệm của công dân\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eMọi công dân Việt Nam có trách nhiệm và nghĩa vụ bảo vệ biên giới quốc gia của nước Cộng hoà xã hội chủ nghĩa Việt Nam, xây dựng khu vực biên giới, giữ gìn an ninh, trật tự an toàn xã hội ở khu vực biên giới. Nếu phát hiện các hành vi xâm phạm biên giới, phá hoại an ninh, trật tự an toàn xã hội ở khu vực biên giới phải báo cho đồn biên phòng hoặc chính quyền địa phương, cơ quan nhà nước nơi gần nhất để thông báo kịp thời cho Bộ đội biên phòng xử lý theo quy định của pháp luật.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a721e-e172-11f0-adbb-b760c0f02d35\" class=\"prov-chapter\" style=\"font-family: 'Times New Roman', Times, serif;\" align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eChương IV\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a721e-e172-11f0-adbb-b760c0f02d35\" class=\"prov-chapter\" style=\"font-family: 'Times New Roman', Times, serif;\" align=\"center\" data-merged=\"true\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e\u0026nbsp;TỔ CHỨC THỰC HIỆN\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a7228-e172-11f0-9476-537e1f245dec\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 33. \u003c/strong\u003eHiệu lực thi hành\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNghị định này có hiệu lực thi hành sau 15 ngày, kể từ ngày đăng Công báo.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a7232-e172-11f0-84a9-0915a8a6a36b\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 34. \u003c/strong\u003eHướng dẫn thi hành\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBộ Quốc phòng chủ trì, phối hợp với các Bộ liên quan xây dựng văn bản hướng dẫn và kiểm tra việc thực hiện Nghị định này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8b2a723c-e172-11f0-b079-853dd689475e\" class=\"prov-article\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 35. \u003c/strong\u003eTrách nhiệm thi hành\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCác Bộ trưởng, Thủ trưởng cơ quan ngang Bộ, Thủ trưởng cơ quan thuộc Chính phủ và Chủ tịch Uỷ ban nhân dân các tỉnh, thành phố trực thuộc Trung ương chịu trách nhiệm thi hành Nghị định này.\u003c/span\u003e\u003c/p\u003e\n  \u003cdiv\u003e\n   \u003cdiv style=\"width: 100%; margin-top: 32px; font-family: 'Times New Roman', serif; font-size: 14px; color: #000; display: flex; justify-content: flex-end;\"\u003e\n    \u003cdiv style=\"display: table-cell; width: 50%; text-align: center; vertical-align: top; font-weight: bold; line-height: 1.8;\"\u003e\n     \u003cdiv style=\"font-weight: bold; text-transform: uppercase; line-height: 1.3;\"\u003e\n      \u003cspan style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif;\"\u003eTM. CHÍNH PHỦ \u003c/span\u003e \u003c/span\u003e\n      \u003cbr\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTHỦ TƯỚNG\u0026nbsp;\u003c/span\u003e\n     \u003c/div\u003e\n     \u003cdiv style=\"font-style: italic; font-weight: bold;\"\u003e\n      \u003cp class=\"MsoNormal\" style=\"text-align: center;\" align=\"center\"\u003e\u003cstrong style=\"mso-bidi-font-weight: normal;\"\u003e\u003cem style=\"mso-bidi-font-style: normal;\"\u003e\u003cspan style=\"color: black;\"\u003e(Đã ký)\u003c/span\u003e\u003c/em\u003e\u003c/strong\u003e\u003c/p\u003e\n     \u003c/div\u003e\n     \u003cdiv style=\"font-weight: bold; margin-top: 16px;\"\u003e\n      \u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ePhan Văn Khải\u003c/span\u003e\n     \u003c/div\u003e\n    \u003c/div\u003e\n   \u003c/div\u003e\n  \u003c/div\u003e\n \u003c/body\u003e\n\u003c/html\u003e"])</script><script>self.__next_f.push([1,"d:[[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"Legislation\\\",\\\"name\\\":\\\"Nghị định số 140/2004/NĐ-CP Quy định chi tiết một số điều của Luật Biên giới quốc gia\\\",\\\"legislationIdentifier\\\":\\\"140/2004/NĐ-CP\\\",\\\"legislationType\\\":\\\"Nghị định\\\",\\\"legislationDate\\\":\\\"2004-06-25T00:00:00\\\",\\\"legislationLegalForce\\\":\\\"PartiallyInForce\\\",\\\"legislationPassedBy\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Chính phủ\\\"},\\\"legislationJurisdiction\\\":\\\"VN\\\",\\\"url\\\":\\\"https://vbpl.vn/van-ban/chi-tiet/nghi-dinh-so-140-2004-nd-cp-quy-dinh-chi-tiet-mot-so-dieu-cua-luat-bien-gioi-quoc-gia--19680\\\",\\\"inLanguage\\\":\\\"vi\\\",\\\"keywords\\\":\\\"Nghị định, Chưa phân loại, Chính phủ, văn bản pháp luật, pháp luật Việt Nam\\\"}\"}}],[\"$\",\"script\",\"breadcrumb-jsonld\",{\"type\":\"application/ld+json\",\"id\":\"breadcrumb-jsonld\",\"data-testid\":\"$undefined\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"BreadcrumbList\\\",\\\"itemListElement\\\":[{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":1,\\\"name\\\":\\\"Trang chủ\\\",\\\"item\\\":\\\"https://vbpl.vn\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":2,\\\"name\\\":\\\"Văn bản trung ương\\\",\\\"item\\\":\\\"https://vbpl.vn/van-ban/trung-uong\\\"},{\\\"@
