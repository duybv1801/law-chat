# Retrieval eval set (T25). Owner reviews and edits this list.
#
# Questions are written for the documents indexed at the time (4 codes crawled from vbpl.vn:
# BLHS 100/2015/QH13, BLTTHS 101/2015/QH13, BLTTDS 92/2015/QH13, Bộ luật Hàng hải 95/2015/QH13).
# Hiến pháp 2013 is indexed without Điều (window chunks, no số hiệu) so it is not used here.
#
# in_scope:   `expected` lists the acceptable (so_hieu, dieu); a question is a hit at k when
#             ANY of them is among the first k source blocks returned by the retriever.
# out_of_scope: nothing in the database answers it; the expected behaviour is a refusal
#             (best dense score below RAG_MIN_SCORE).
#
# Most questions are phrased like a user would ask (no số hiệu); a few mention the số hiệu
# to exercise the số hiệu filter.

in_scope:
  # --- Bộ luật Hình sự 100/2015/QH13 ---
  - id: hs-01
    question: Người bao nhiêu tuổi thì phải chịu trách nhiệm hình sự?
    expected: [{so_hieu: 100/2015/QH13, dieu: Điều 12}]
  - id: hs-02
    question: Trộm cắp tài sản trị giá bao nhiêu tiền thì bị truy cứu trách nhiệm hình sự?
    expected: [{so_hieu: 100/2015/QH13, dieu: Điều 173}]
  - id: hs-03
    question: Lừa đảo chiếm đoạt tài sản bị phạt tù bao nhiêu năm?
    expected: [{so_hieu: 100/2015/QH13, dieu: Điều 174}]
  - id: hs-04
    question: Những tình tiết nào được coi là giảm nhẹ trách nhiệm hình sự?
    expected: [{so_hieu: 100/2015/QH13, dieu: Điều 51}]
  - id: hs-05
    question: Phạm tội có tính chất côn đồ, tái phạm nguy hiểm có phải là tình tiết tăng nặng không?
    expected: [{so_hieu: 100/2015/QH13, dieu: Điều 52}]
  - id: hs-06
    question: Điều kiện để được hưởng án treo là gì?
    expected: [{so_hieu: 100/2015/QH13, dieu: Điều 65}]
  - id: hs-07
    question: Cố ý gây thương tích cho người khác với tỷ lệ tổn thương cơ thể 11% thì bị xử lý thế nào?
    expected: [{so_hieu: 100/2015/QH13, dieu: Điều 134}]
  - id: hs-08
    question: Đánh bạc trái phép bằng tiền với số tiền bao nhiêu thì bị truy cứu trách nhiệm hình sự?
    expected: [{so_hieu: 100/2015/QH13, dieu: Điều 321}]
  - id: hs-09
    question: Công chức nhận hối lộ từ 2 triệu đồng bị phạt thế nào theo Bộ luật Hình sự 100/2015/QH13?
    expected: [{so_hieu: 100/2015/QH13, dieu: Điều 354}]
  - id: hs-10
    question: Khác nhau giữa tội cướp tài sản và tội cướp giật tài sản là gì?
    expected:
      - {so_hieu: 100/2015/QH13, dieu: Điều 168}
      - {so_hieu: 100/2015/QH13, dieu: Điều 171}
  - id: hs-11
    question: Gây tai nạn giao thông làm chết người khi lái xe thì bị phạt tù bao lâu?
    expected: [{so_hieu: 100/2015/QH13, dieu: Điều 260}]
  - id: hs-12
    question: Tàng trữ trái phép chất ma túy bị xử lý hình sự như thế nào?
    expected: [{so_hieu: 100/2015/QH13, dieu: Điều 249}]

